apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/managed-by: argocd
    environment: staging
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-gateway.observability.svc.cluster.local
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
        derivedFields:
          # Extract trace_id from logs and create link to Tempo
          - name: trace_id
            matcherRegex: "trace_id[\"=:]\\s*([\\w-]+)"
            url: "$${__value.raw}"
            datasourceUid: tempo

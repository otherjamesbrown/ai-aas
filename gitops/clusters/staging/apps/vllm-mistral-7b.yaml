apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-mistral-7b-staging
  namespace: argocd
  labels:
    environment: staging
    app: vllm-inference
    model: mistral-7b-instruct
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging
  source:
    repoURL: https://github.com/otherjamesbrown/ai-aas
    targetRevision: staging
    path: infra/k8s/kserve/models
    directory:
      include: mistral-7b-instruct-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-datasources-staging
  namespace: argocd
  labels:
    environment: staging
    app: grafana-datasources
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging
  source:
    repoURL: https://github.com/otherjamesbrown/ai-aas
    targetRevision: staging
    path: gitops/clusters/staging/apps/observability-datasources
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false  # monitoring namespace already exists
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

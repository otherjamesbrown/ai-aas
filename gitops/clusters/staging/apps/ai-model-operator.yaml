apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-model-operator-staging
  namespace: argocd
  labels:
    environment: staging
    app: ai-model-operator
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: platform-staging
  source:
    repoURL: https://github.com/otherjamesbrown/ai-aas
    targetRevision: staging
    path: operators/ai-model-operator/deployments/helm/ai-model-operator
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-model-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

# Monitoring Configuration ArgoCD Application
# Deploys monitoring configuration resources (ConfigMaps, base setup)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config-staging
  namespace: argocd
  labels:
    environment: staging
    app: monitoring-config
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging

  source:
    repoURL: https://github.com/otherjamesbrown/ai-aas
    targetRevision: staging
    path: infra/k8s/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

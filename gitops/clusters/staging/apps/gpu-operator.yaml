apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-operator-staging
  namespace: argocd
  labels:
    environment: staging
    app: gpu-operator
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging
  source:
    repoURL: https://nvidia.github.io/gpu-operator
    chart: gpu-operator
    targetRevision: v25.10.1
    helm:
      releaseName: gpu-operator
      values: |
        operator:
          defaultRuntime: containerd
        driver:
          enabled: true
          version: "550.127.05"
        toolkit:
          enabled: true
        devicePlugin:
          enabled: true
        dcgmExporter:
          enabled: true
        migManager:
          enabled: false
        nodeStatusExporter:
          enabled: true
        gfd:
          enabled: true
        daemonsets:
          tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "gpu-workload"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
        node-feature-discovery:
          worker:
            tolerations:
            - key: "node-role.kubernetes.io/master"
              operator: "Equal"
              value: ""
              effect: "NoSchedule"
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Equal"
              value: ""
              effect: "NoSchedule"
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
            - key: "gpu-workload"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  ignoreDifferences:
    - group: nvidia.com
      kind: ClusterPolicy
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

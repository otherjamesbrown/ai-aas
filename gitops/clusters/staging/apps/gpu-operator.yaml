apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-operator-staging
  namespace: argocd
  labels:
    environment: staging
    app: gpu-operator
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging
  source:
    repoURL: https://nvidia.github.io/gpu-operator
    chart: gpu-operator
    targetRevision: v24.9.0
    helm:
      releaseName: gpu-operator
      values: |
        operator:
          defaultRuntime: containerd
        driver:
          enabled: true
          version: "550.127.05"
        toolkit:
          enabled: true
        devicePlugin:
          enabled: true
        dcgmExporter:
          enabled: true
        migManager:
          enabled: false
        nodeStatusExporter:
          enabled: true
        gfd:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

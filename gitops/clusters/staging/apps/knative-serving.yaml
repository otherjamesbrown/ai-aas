apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-config-staging
  namespace: argocd
  labels:
    environment: staging
    app: knative-serving
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging
  source:
    repoURL: https://github.com/otherjamesbrown/ai-aas
    targetRevision: staging
    path: infra/k8s/knative-serving
  destination:
    server: https://kubernetes.default.svc
    namespace: knative-serving
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
# Knative Serving Components
# Note: Main Knative installation is via knative-config-staging (infra/k8s/knative-serving)
# This file only manages the net-istio networking layer
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-net-istio-staging
  namespace: argocd
  labels:
    environment: staging
    app: knative-serving
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging
  source:
    repoURL: https://github.com/otherjamesbrown/ai-aas
    targetRevision: staging
    path: infra/k8s/knative/net-istio
  destination:
    server: https://kubernetes.default.svc
    namespace: knative-serving
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-staging
  namespace: argocd
  labels:
    environment: staging
    app: grafana
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 8.6.4
    helm:
      releaseName: grafana
      values: |
        replicas: 1
        persistence:
          enabled: true
          size: 10Gi
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Loki
                type: loki
                url: http://loki.observability.svc.cluster.local:3100
                access: proxy
                isDefault: true
              - name: Prometheus
                type: prometheus
                url: http://prometheus-server.observability.svc.cluster.local:80
                access: proxy
        service:
          type: ClusterIP
          port: 80
        ingress:
          enabled: true
          hosts:
            - grafana.staging.ai-aas.local
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

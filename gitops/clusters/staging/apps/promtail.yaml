apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail-staging
  namespace: argocd
  labels:
    environment: staging
    app: promtail
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: promtail
    targetRevision: 6.16.6
    helm:
      releaseName: promtail
      values: |
        config:
          clients:
            - url: http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push
          snippets:
            pipelineStages:
              - cri: {}
              - json:
                  expressions:
                    level: level
                    msg: msg
                    service: service
              - labels:
                  level:
                  service:
        tolerations:
          - key: gpu-workload
            operator: Exists
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

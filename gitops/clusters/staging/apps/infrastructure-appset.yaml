apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: staging-infrastructure
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: network
            namespace: network
            path: gitops/clusters/staging/apps/network
          - name: observability
            namespace: observability
            path: gitops/clusters/staging/apps/observability
          - name: secrets
            namespace: secrets
            path: gitops/clusters/staging/apps/secrets
  template:
    metadata:
      name: '{{name}}-staging'
      labels:
        environment: staging
    spec:
      project: platform-staging
      source:
        repoURL: https://github.com/otherjamesbrown/ai-aas
        targetRevision: staging
        path: '{{path}}'
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

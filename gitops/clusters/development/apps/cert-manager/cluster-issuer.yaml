# Let's Encrypt ClusterIssuers for automatic TLS certificate management
# Using HTTP-01 challenge with nginx ingress controller
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Use staging endpoint for testing (higher rate limits)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: james@brown.chat
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Production endpoint - use after testing with staging
    server: https://acme-v02.api.letsencrypt.org/directory
    email: james@brown.chat
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx

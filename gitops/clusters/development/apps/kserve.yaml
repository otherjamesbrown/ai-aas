apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve-development
  namespace: argocd
  labels:
    environment: development
    app: kserve
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-development
  source:
    repoURL: https://github.com/otherjamesbrown/ai-aas
    targetRevision: 020-model-management  # Change to main after merge
    path: infra/k8s/kserve/install
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

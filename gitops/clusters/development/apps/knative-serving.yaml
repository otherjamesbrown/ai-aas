apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-serving-crds-development
  namespace: argocd
  labels:
    environment: development
    app: knative-serving
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-development
  source:
    repoURL: https://github.com/knative/serving
    targetRevision: knative-v1.11.0
    path: config/core/300-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: knative-serving
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - Replace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-serving-core-development
  namespace: argocd
  labels:
    environment: development
    app: knative-serving
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-development
  source:
    repoURL: https://github.com/knative/serving
    targetRevision: knative-v1.11.0
    path: config/core/300-core
  destination:
    server: https://kubernetes.default.svc
    namespace: knative-serving
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-net-istio-development
  namespace: argocd
  labels:

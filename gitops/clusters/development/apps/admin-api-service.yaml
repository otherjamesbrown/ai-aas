apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-api-service-development
  namespace: argocd
  labels:
    environment: development
    app: admin-api-service
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-development
  source:
    repoURL: https://github.com/otherjamesbrown/ai-aas
    targetRevision: 020-model-management
    path: services/admin-api-service/deployments/helm/admin-api-service
    helm:
      valueFiles:
        - values.yaml
      values: |
        image:
          repository: ghcr.io/otherjamesbrown/ai-aas/admin-api-service
          tag: latest
          pullPolicy: Always

        replicaCount: 1

        env:
          - name: PORT
            value: "8080"
          - name: ENVIRONMENT
            value: development
          - name: LOG_LEVEL
            value: info

        secrets:
          databaseUrlSecretName: admin-api-secrets
          databaseUrlSecretKey: database-url
          apiKeyHashSaltSecretName: admin-api-secrets
          apiKeyHashSaltSecretKey: api-key-hash-salt

        userOrgService:
          endpoint: "http://user-org-service-development-user-org-service.user-org-service.svc.cluster.local:8081"

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: admin-api-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-api-service-development
  namespace: argocd
  labels:
    environment: development
    app: admin-api-service
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-development
  source:
    repoURL: https://github.com/otherjamesbrown/ai-aas
    targetRevision: 020-model-management
    path: services/admin-api-service/deployments/helm/admin-api-service
    helm:
      valueFiles:
        - values.yaml
        - values-development.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: admin-api-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

apiVersion: v1
kind: Service
metadata:
  name: admin-api-service
  labels:
    app: admin-api-service
    app.kubernetes.io/name: admin-api-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: admin-api-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-api-service
  labels:
    app: admin-api-service


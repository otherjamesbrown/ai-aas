# Staging environment overrides
# Domain configuration is computed from global.domain.base

global:
  domain:
    base: "staging.otherjamesbrown.com"
    local: "staging.otherjamesbrown.com"

replicaCount: 2

image:
  repository: ghcr.io/otherjamesbrown/ai-aas/admin-api-service
  tag: sha-923f2ed
  pullPolicy: Always
  pullSecrets:
    - ghcr-pull-secret

env:
  - name: PORT
    value: "8080"
  - name: ENVIRONMENT
    value: staging
  - name: GUIDELLM_RUNNER_URL
    value: "http://guidellm-runner-staging.staging.svc.cluster.local:8080"

secrets:
  databaseUrlSecretName: admin-api-secrets
  databaseUrlSecretKey: database-url
  apiKeyHashSaltSecretName: admin-api-secrets
  apiKeyHashSaltSecretKey: api-key-hash-salt
  masterAdminApiKeySecretName: admin-api-secrets
  masterAdminApiKeySecretKey: master-admin-api-key

userOrgService:
  endpoint: "http://user-org-service-staging-user-org-service.user-org-service.svc.cluster.local:8081"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

ingress:
  enabled: true

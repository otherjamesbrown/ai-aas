# Development environment overrides
# Domain configuration is computed from global.domain.base
# See values.yaml for defaults and configs/environments/development.yaml for canonical source

replicaCount: 1
image:
  repository: ghcr.io/otherjamesbrown/ai-aas/admin-api-service
  # Using 'dev' tag to match CI build output for develop branch.
  # Staging uses 'staging' tag, production uses 'latest' tag.
  tag: "sha-923f2ed"
  pullPolicy: Always
env:
  - name: PORT
    value: "8080"
  - name: ENVIRONMENT
    value: development
  - name: GUIDELLM_RUNNER_URL
    value: "http://guidellm-runner-development.development.svc.cluster.local:8080"
secrets:
  databaseUrlSecretName: admin-api-secrets
  databaseUrlSecretKey: database-url
  apiKeyHashSaltSecretName: admin-api-secrets
  apiKeyHashSaltSecretKey: api-key-hash-salt
  masterAdminApiKeySecretName: admin-api-secrets
  masterAdminApiKeySecretKey: master-admin-api-key
# Migrations disabled - tables already exist and goose version table is inconsistent
# TODO: aas-kzuqa - Reset goose_db_version table to match actual database state
migrations:
  enabled: false
# Higher rate limit for development/testing
config:
  rateLimitPerMin: "500"
userOrgService:
  endpoint: "http://user-org-service-development-user-org-service.user-org-service.svc.cluster.local:8081"
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
# Node scheduling - prefer CPU nodes (avoid GPU nodes)
# GPU nodes have taint nvidia.com/gpu=true:NoSchedule
# CPU nodes are in pool 770211, GPU nodes are in pool 776664
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: lke.linode.com/pool-id
              operator: In
              values:
                - "770211" # CPU node pool
# Ingress configuration - hosts computed from global.domain.base
ingress:
  enabled: true
  # subdomain: admin-api (default from values.yaml)
  # Hosts are computed automatically:
  #   - admin-api.dev.otherjamesbrown.com (local domain)
  #   - admin-api.dev.otherjamesbrown.com (public domain)

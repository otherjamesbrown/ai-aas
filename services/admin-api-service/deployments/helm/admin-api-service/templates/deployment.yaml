apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "admin-api-service.fullname" . }}
  labels:
    {{- include "admin-api-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "admin-api-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "admin-api-service.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      serviceAccountName: {{ include "admin-api-service.serviceAccountName" . }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range .Values.env }}
            {{- if .valueFrom }}
            - name: {{ .name }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
            {{- else }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
            {{- range .Values.extraEnv }}
            {{- if .valueFrom }}
            - name: {{ .name }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
            {{- else }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.secrets.databaseUrlSecretName }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseUrlSecretName }}
                  key: {{ .Values.secrets.databaseUrlSecretKey }}
            {{- end }}
            {{- if .Values.secrets.apiKeyHashSaltSecretName }}
            - name: API_KEY_HASH_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.apiKeyHashSaltSecretName }}
                  key: {{ .Values.secrets.apiKeyHashSaltSecretKey }}
            {{- end }}
            {{- if .Values.secrets.masterAdminApiKeySecretName }}
            - name: MASTER_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.masterAdminApiKeySecretName }}
                  key: {{ .Values.secrets.masterAdminApiKeySecretKey }}
            {{- end }}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "admin-api-service.fullname" . }}-config
                  key: log-level
            - name: RATE_LIMIT_PER_MIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "admin-api-service.fullname" . }}-config
                  key: rate-limit-per-min
            {{- if .Values.userOrgService.endpoint }}
            - name: USER_ORG_SERVICE_URL
              value: {{ .Values.userOrgService.endpoint | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      terminationGracePeriodSeconds: 30

{{- if .Values.ingress.enabled -}}
{{- $fullName := include "admin-api-service.fullname" . -}}
{{- $subdomain := .Values.ingress.subdomain | default "admin-api" -}}
{{- $baseDomain := .Values.global.domain.base -}}
{{- $localDomain := .Values.global.domain.local | default "" -}}
{{- $tlsEnabled := .Values.global.tls.enabled | default true -}}
{{- $clusterIssuer := .Values.global.tls.clusterIssuer | default "letsencrypt-prod" -}}
{{- $tlsSecretName := .Values.ingress.tlsSecretName | default (printf "%s-tls" $subdomain) -}}
{{- $publicHost := printf "%s.%s" $subdomain $baseDomain -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "admin-api-service.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $tlsEnabled }}
    cert-manager.io/cluster-issuer: {{ $clusterIssuer | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if $tlsEnabled }}
  tls:
    - secretName: {{ $tlsSecretName }}
      hosts:
        - {{ $publicHost | quote }}
  {{- end }}
  rules:
    {{- /* Use explicit hosts if provided, otherwise compute from subdomain */ -}}
    {{- if .Values.ingress.hosts }}
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
    {{- else }}
    {{- /* Computed hosts from global domain */ -}}
    {{- if $localDomain }}
    - host: {{ printf "%s.%s" $subdomain $localDomain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .Values.service.port }}
    {{- end }}
    - host: {{ $publicHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .Values.service.port }}
    {{- end }}
{{- end }}

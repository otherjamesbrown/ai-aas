{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "admin-api-service.fullname" . }}-pod-reader
  labels:
    {{- include "admin-api-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "admin-api-service.fullname" . }}-pod-reader
  labels:
    {{- include "admin-api-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "admin-api-service.fullname" . }}-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "admin-api-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

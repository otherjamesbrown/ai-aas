# Admin API Service - Helm Chart Values
# =====================================
#
# Domain Configuration:
# --------------------
# This chart uses centralized domain configuration. Override `global.domain.base`
# in environment-specific values files (values-development.yaml, values-production.yaml).
#
# All ingress hostnames are derived from global.domain.base:
#   - admin-api.{global.domain.base} -> admin-api.dev.otherjamesbrown.com
#
# See configs/environments/*.yaml for environment-specific domain settings.
#
# For AI Coding Assistants:
# ------------------------
# 1. NEVER hardcode domain names - use global.domain.base
# 2. ALWAYS use HTTPS (force-ssl-redirect: "true")
# 3. Use cert-manager with Let's Encrypt for TLS certificates
# 4. All deployments MUST go through ArgoCD
#

# Global configuration - shared across all services
# Override in values-{environment}.yaml
global:
  domain:
    # Base domain for this environment (override per environment)
    base: "dev.otherjamesbrown.com"
    # Local hostname for /etc/hosts access (optional)
    local: "dev.ai-aas.local"
    # Protocol for URLs
    protocol: "https"
  tls:
    # Enable TLS with cert-manager
    enabled: true
    # ClusterIssuer to use for certificates
    clusterIssuer: "letsencrypt-prod"
  # Service subdomains - used to construct full hostnames
  services:
    adminApi: "admin-api"

replicaCount: 2

image:
  repository: ghcr.io/otherjamesbrown/ai-aas/admin-api-service
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
  logging.enabled: "true"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /readyz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

env:
  - name: PORT
    value: "8080"
  - name: ENVIRONMENT
    value: development
  - name: LOG_LEVEL
    value: info

extraEnv: []

config:
  logLevel: info
  rateLimitPerMin: "100"
  dbMaxConns: "50"
  dbMinConns: "10"
  metricsEnabled: "true"
  tracingEnabled: "false"

secrets:
  databaseUrlSecretName: admin-api-secrets
  databaseUrlSecretKey: database-url
  apiKeyHashSaltSecretName: admin-api-secrets
  apiKeyHashSaltSecretKey: api-key-hash-salt

userOrgService:
  endpoint: "http://user-org-service-development-user-org-service.user-org-service.svc.cluster.local:8081"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # cert-manager annotation will be added by template when tls.enabled
  # Service subdomain - combined with global.domain.base
  subdomain: admin-api
  # hosts is now computed from global.domain.base in the template
  # Override with explicit hosts array only if needed
  hosts: []
  # TLS secret name - will be auto-generated if empty
  tlsSecretName: ""

# Pod Disruption Budget - ensures availability during upgrades/maintenance
podDisruptionBudget:
  enabled: true
  minAvailable: 1  # At least 1 pod must remain available

# Network Policy - controls ingress/egress traffic
networkPolicy:
  enabled: false  # Enable in production for security isolation

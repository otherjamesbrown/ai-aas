replicaCount: 2

image:
  repository: ghcr.io/otherjamesbrown/ai-aas/admin-api-service
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
  logging.enabled: "true"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /readyz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

env:
  - name: PORT
    value: "8080"
  - name: ENVIRONMENT
    value: development
  - name: LOG_LEVEL
    value: info

extraEnv: []

config:
  logLevel: info
  rateLimitPerMin: "100"
  dbMaxConns: "50"
  dbMinConns: "10"
  metricsEnabled: "true"
  tracingEnabled: "false"

secrets:
  databaseUrlSecretName: admin-api-secrets
  databaseUrlSecretKey: database-url
  apiKeyHashSaltSecretName: admin-api-secrets
  apiKeyHashSaltSecretKey: api-key-hash-salt

userOrgService:
  endpoint: "http://user-org-service-development-user-org-service.user-org-service.svc.cluster.local:8081"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: admin-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

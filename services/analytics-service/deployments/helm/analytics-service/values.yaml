# Analytics Service - Helm Chart Values
# =====================================
#
# Domain Configuration:
# --------------------
# This chart uses centralized domain configuration. Override `global.domain.base`
# in environment-specific values files (values-development.yaml, values-production.yaml).
#
# All ingress hostnames are derived from global.domain.base:
#   - analytics.{global.domain.base} -> analytics.dev.otherjamesbrown.com
#
# See configs/environments/*.yaml for environment-specific domain settings.
#
# For AI Coding Assistants:
# ------------------------
# 1. NEVER hardcode domain names - use global.domain.base
# 2. ALWAYS use HTTPS (force-ssl-redirect: "true")
# 3. Use cert-manager with Let's Encrypt for TLS certificates
# 4. All deployments MUST go through ArgoCD
#
# See docs/platform/ingress-best-practices.md for complete documentation
#

# Global configuration - shared across all services
# Override in values-{environment}.yaml
global:
  domain:
    # Base domain for this environment (override per environment)
    base: "dev.otherjamesbrown.com"
    # Local hostname for /etc/hosts access (optional)
    local: "dev.otherjamesbrown.com"
    # Protocol for URLs
    protocol: "https"
  tls:
    # Enable TLS with cert-manager
    enabled: true
    # ClusterIssuer to use for certificates
    clusterIssuer: "letsencrypt-prod"
  # Service subdomains - used to construct full hostnames
  services:
    analytics: "analytics"

replicaCount: 2

image:
  repository: ghcr.io/otherjamesbrown/analytics-service
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Pod annotations
# logging.enabled: "true" enables Promtail log collection
# prometheus.io annotations enable Prometheus scraping
podAnnotations:
  logging.enabled: "true"
  prometheus.io/scrape: "true"
  prometheus.io/port: "8084"
  prometheus.io/path: "/metrics"

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8084

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # cert-manager annotation will be added by template when tls.enabled
  # Service subdomain - combined with global.domain.base
  subdomain: analytics
  # Path prefix for this service
  path: /analytics
  pathType: Prefix
  # hosts is now computed from global.domain.base in the template
  # Override with explicit hosts array only if needed
  hosts: []
  # TLS secret name - will be auto-generated if empty
  tlsSecretName: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  path: /analytics/v1/status/healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /analytics/v1/status/readyz
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

env:
  - name: SERVICE_NAME
    value: analytics-service
  - name: HTTP_PORT
    value: "8084"
  - name: ENVIRONMENT
    value: development
  - name: LOG_LEVEL
    value: info

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# Telemetry configuration
otel:
  enabled: false
  collectorEndpoint: ""
  protocol: grpc
  insecure: true

# Prometheus metrics
prometheus:
  enabled: true
  port: 8084
  path: /metrics

# Database configuration for analytics data
database:
  url: ""
  urlSecretName: ""

# Database migrations
migrations:
  enabled: true

# Redis configuration for caching
redis:
  url: ""
  urlSecretName: ""

# RabbitMQ configuration for event ingestion
rabbitmq:
  url: ""
  stream: usage.events.v1
  consumer: analytics-service
  urlSecretName: ""

# S3 configuration for data exports (optional)
s3:
  enabled: false
  endpoint: ""
  accessKey: ""
  secretKey: ""
  bucket: analytics-exports
  endpointSecretName: ""
  accessKeySecretName: ""
  secretKeySecretName: ""

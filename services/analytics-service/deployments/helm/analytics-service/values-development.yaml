# Analytics Service - Development Environment Values
# =================================================
#
# This file overrides values.yaml for the development environment.
# Deployed automatically via ArgoCD when changes are pushed to the develop branch.
#
# Domain configuration is computed from global.domain.base
# See values.yaml for defaults and configs/environments/development.yaml for canonical source
#
# Key characteristics of development environment:
# - Uses 'dev' image tag (built from develop branch)
# - pullPolicy: Always (ensures latest dev image is pulled)
# - Debug logging enabled
# - Connects to development-namespace services
# - Auto-scaling configured for load testing
#

image:
  repository: ghcr.io/otherjamesbrown/ai-aas/analytics-service
  tag: "sha-923f2ed"
  pullPolicy: Always
  pullSecrets:
    - ghcr-pull-secret
replicaCount: 1
env:
  - name: SERVICE_NAME
    value: analytics-service
  - name: HTTP_PORT
    value: "8084"
  - name: ENVIRONMENT
    value: development
  - name: LOG_LEVEL
    value: debug
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: analytics-service-secrets
        key: database-url
  - name: REDIS_URL
    value: redis://redis.development.svc.cluster.local:6379
  - name: RABBITMQ_URL
    valueFrom:
      secretKeyRef:
        name: analytics-service-secrets
        key: rabbitmq-url
        optional: true
  - name: RABBITMQ_STREAM
    value: usage.events.v1
  - name: RABBITMQ_CONSUMER
    value: analytics-service-development
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: otel-collector.monitoring.svc.cluster.local:4317
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: grpc
  - name: OTEL_EXPORTER_OTLP_INSECURE
    value: "true"
  - name: KAFKA_BROKERS
    value: kafka.kafka.svc.cluster.local:9092
  - name: KAFKA_TOPIC
    value: usage.records.v1
  - name: KAFKA_CONSUMER_GROUP
    value: analytics-service-development
  - name: MASTER_ADMIN_API_KEY
    valueFrom:
      secretKeyRef:
        name: analytics-service-secrets
        key: master-admin-api-key
service:
  type: ClusterIP
  port: 8084
# Ingress configuration - hosts computed from global.domain.base
ingress:
  enabled: true
  # subdomain: analytics (default from values.yaml)
  # path: /analytics (default from values.yaml)
  # Hosts are computed automatically:
  #   - analytics.dev.otherjamesbrown.com (local domain)
  #   - analytics.dev.otherjamesbrown.com (public domain)
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
livenessProbe:
  path: /analytics/v1/status/healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  path: /analytics/v1/status/readyz
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
# Telemetry configuration
# Note: OTEL_* env vars are set directly in env: list above
otel:
  enabled: false # Disabled to avoid duplicate env vars
# Prometheus metrics
prometheus:
  enabled: true
  port: 8084
  path: /metrics
# Database configuration
# Note: DATABASE_URL is set directly in env: list above
database:
  urlSecretName: "" # Disabled to avoid duplicate env var
# Redis configuration
# Note: REDIS_URL is set directly in env: list above
redis:
  url: "" # Disabled to avoid duplicate env var
# RabbitMQ configuration
# Note: RABBITMQ_* env vars are set directly in env: list above
rabbitmq:
  urlSecretName: "" # Disabled to avoid duplicate env var
  stream: ""
  consumer: ""
# S3 configuration - enabled for analytics exports
# Uses Linode Object Storage bucket 'ai-aas' in fr-par-1 region
# Credentials stored in analytics-service-s3 secret (created imperatively)
s3:
  enabled: true
  endpointSecretName: analytics-service-s3
  accessKeySecretName: analytics-service-s3
  secretKeySecretName: analytics-service-s3
  bucket: ai-aas
  region: fr-par-1
# Node scheduling - prefer CPU nodes (avoid GPU nodes)
# GPU nodes have taint nvidia.com/gpu=true:NoSchedule
# CPU nodes are in pool 770211, GPU nodes are in pool 776664
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: lke.linode.com/pool-id
              operator: In
              values:
                - "770211" # CPU node pool
# Migrations disabled - tables already exist from previous deployment
# TimescaleDB extension is not available on shared database
migrations:
  enabled: false

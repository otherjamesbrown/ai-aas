# Staging environment overrides
# Domain configuration is computed from global.domain.base

global:
  domain:
    base: "staging.otherjamesbrown.com"
    local: "staging.ai-aas.local"

replicaCount: 2

image:
  repository: ghcr.io/otherjamesbrown/analytics-service
  # Use 'latest' until CI builds staging tags (see beads issue)
  tag: latest
  pullPolicy: Always

env:
  - name: SERVICE_NAME
    value: analytics-service
  - name: HTTP_PORT
    value: "8084"
  - name: ENVIRONMENT
    value: staging
  - name: LOG_LEVEL
    value: info

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true

# Increase startup time for database connection to remote Linode Postgres
livenessProbe:
  path: /analytics/v1/status/healthz
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  path: /analytics/v1/status/readyz
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 5

# Telemetry configuration
otel:
  enabled: true
  collectorEndpoint: otel-collector.observability.svc.cluster.local:4317
  protocol: grpc
  insecure: true

# Database configuration - reference staging secret
database:
  urlSecretName: analytics-service-secrets

# Redis configuration - uses staging Redis
redis:
  url: "redis://redis-master.staging.svc.cluster.local:6379"

# RabbitMQ configuration (optional for staging - using stub endpoint)
rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
  stream: usage.events.v1
  consumer: analytics-service-staging

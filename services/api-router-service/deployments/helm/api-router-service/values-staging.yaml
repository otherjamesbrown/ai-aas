# Staging environment overrides
replicaCount: 3

image:
  tag: staging

service:
  type: ClusterIP

# Override global domain for staging environment
global:
  domain:
    base: "staging.otherjamesbrown.com"
    local: "staging.ai-aas.local"
  tls:
    enabled: true
    clusterIssuer: "letsencrypt-staging"

ingress:
  enabled: true
  className: nginx
  # Explicit hosts to include both local and public domains
  hosts:
    - host: api.staging.otherjamesbrown.com
      paths:
        - path: /
          pathType: Prefix
    - host: api.staging.ai-aas.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  - name: SERVICE_NAME
    value: api-router-service
  - name: HTTP_PORT
    value: "8080"
  - name: ENVIRONMENT
    value: staging
  - name: LOG_LEVEL
    value: info
  - name: USER_ORG_SERVICE_URL
    value: "http://user-org-service-staging-user-org-service.user-org-service.svc.cluster.local:8081"
  - name: USER_ORG_SERVICE_TIMEOUT
    value: "5s"

# Increase startup time for connections to remote services
livenessProbe:
  path: /v1/status/healthz
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  path: /v1/status/readyz
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 5

otel:
  enabled: true
  collectorEndpoint: otel-collector.observability.svc.cluster.local:4317
  protocol: grpc
  insecure: true

prometheus:
  enabled: true
  port: 8080
  path: /metrics

redis:
  address: redis-master.staging.svc.cluster.local:6379
  passwordSecretName: redis-staging-secret

# Kafka disabled for staging (not deployed yet)
kafka:
  brokers: ""
  topic: usage.records.v1
  auditTopic: audit.router

configService:
  endpoint: etcd-service.staging.svc.cluster.local:2379
  watchEnabled: true
  cachePath: /tmp/api-router-config.db

# Budget service disabled for staging
budget:
  endpoint: ""
  timeout: 2s

# Use Admin API for routing config instead of etcd in staging
adminApi:
  endpoint: http://admin-api-service-staging.admin-api-service.svc.cluster.local:8080
  syncInterval: 30s

# Backend endpoints - configure vLLM service
backends:
  # Format: model-id:http://service-name.namespace.svc.cluster.local:port
  # KServe InferenceServices are exposed via Knative Services
  #
  # IMPORTANT: Use the -private service on port 8012 (queue-proxy port)
  # - Port 80 on regular services routes through Istio which causes timeouts
  # - Port 8012 on -private services connects directly to the queue-proxy sidecar
  endpoints: "mistralai/Mistral-7B-Instruct-v0.3:http://mistral-7b-instruct-staging-predictor-00002-private.staging.svc.cluster.local:8012"

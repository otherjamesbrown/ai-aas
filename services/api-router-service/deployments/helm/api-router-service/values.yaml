# API Router Service - Helm Chart Values
# =====================================
#
# Domain Configuration:
# --------------------
# This chart uses centralized domain configuration. Override `global.domain.base`
# in environment-specific values files (values-development.yaml, values-production.yaml).
#
# All ingress hostnames are derived from global.domain.base:
#   - api.{global.domain.base} -> api.dev.otherjamesbrown.com
#   - portal.{global.domain.base} -> portal.dev.otherjamesbrown.com
#
# See configs/environments/*.yaml for environment-specific domain settings.
#
# For AI Coding Assistants:
# ------------------------
# 1. NEVER hardcode domain names - use global.domain.base
# 2. ALWAYS use HTTPS (force-ssl-redirect: "true")
# 3. Use cert-manager with Let's Encrypt for TLS certificates
# 4. All deployments MUST go through ArgoCD
#
# See docs/ingress-best-practices.md for complete documentation
#

# Global configuration - shared across all services
# Override in values-{environment}.yaml
global:
  domain:
    # Base domain for this environment (override per environment)
    base: "dev.otherjamesbrown.com"
    # Local hostname for /etc/hosts access (optional)
    local: "dev.otherjamesbrown.com"
    # Protocol for URLs
    protocol: "https"
  tls:
    # Enable TLS with cert-manager
    enabled: true
    # ClusterIssuer to use for certificates
    clusterIssuer: "letsencrypt-prod"
  # Service subdomains - used to construct full hostnames
  # Format: {subdomain}.{global.domain.base}
  services:
    api: "api"
    portal: "portal"
    adminApi: "admin-api"
    userOrg: "user-org"
    analytics: "analytics"

replicaCount: 2

image:
  repository: ghcr.io/otherjamesbrown/api-router-service
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Pod annotations
# logging.enabled: "true" enables Promtail log collection
podAnnotations:
  logging.enabled: "true"

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # cert-manager annotation will be added by template when tls.enabled
  # Service subdomain - combined with global.domain.base
  subdomain: api
  # hosts is now computed from global.domain.base in the template
  # Override with explicit hosts array only if needed
  hosts: []
  # TLS secret name - will be auto-generated if empty
  tlsSecretName: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  path: /v1/status/healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /v1/status/readyz
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 10  # Increased to accommodate multiple health checks
  failureThreshold: 6  # More tolerant of intermittent failures

env:
  - name: SERVICE_NAME
    value: api-router-service
  - name: HTTP_PORT
    value: "8080"
  - name: ENVIRONMENT
    value: development
  - name: LOG_LEVEL
    value: info

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# Telemetry configuration
otel:
  enabled: false
  collectorEndpoint: ""
  protocol: grpc
  insecure: true

# Prometheus metrics
prometheus:
  enabled: true
  port: 8080
  path: /metrics

# Redis configuration for rate limiting
redis:
  address: redis-service:6379
  password: ""
  db: 0
  passwordSecretName: ""

# Kafka configuration for usage records
kafka:
  brokers: kafka-service:9092
  topic: usage.records.v1
  auditTopic: audit.router
  brokersSecretName: ""

# Config service (etcd) configuration
configService:
  endpoint: etcd-service:2379
  watchEnabled: true
  cachePath: /tmp/api-router-config.db

# Backend endpoints configuration
backends:
  endpoints: ""

# Rate limiting configuration
rateLimit:
  defaultRPS: 100
  burstSize: 200

# Budget service configuration
budget:
  endpoint: ""
  timeout: 2s
  endpointSecretName: ""

# Pod Disruption Budget - ensures availability during upgrades/maintenance
podDisruptionBudget:
  enabled: true
  minAvailable: 1  # At least 1 pod must remain available
  # maxUnavailable: 1  # Alternative: allow max 1 pod unavailable


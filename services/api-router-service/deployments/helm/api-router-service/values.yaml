# API Router Service - Helm Chart Values
# =====================================
#
# For AI Coding Assistants:
# ------------------------
# When deploying services with ingress, follow these best practices:
#
# 1. ALWAYS include both hostname-based AND IP-based (nip.io) access in development
#    - Hostname: For proper DNS/hosts file setup (e.g., api.dev.ai-aas.local)
#    - IP-based: For easy testing without DNS configuration (e.g., api.<IP>.nip.io)
#
# 2. ALWAYS use HTTPS (force-ssl-redirect: "true") even in development
#    - Self-signed certificates are acceptable for dev
#    - Use cert-manager with Let's Encrypt for staging/production
#
# 3. LoadBalancer IP Discovery:
#    To find the current LoadBalancer IP for nip.io configuration:
#    kubectl get svc -n ingress-nginx ingress-nginx-controller \
#      -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
#
# 4. Testing API Access:
#    # Via nip.io (no /etc/hosts needed):
#    curl -k -H "X-API-Key: YOUR_KEY" https://api.<IP>.nip.io/v1/status/healthz
#
#    # Via hostname (requires /etc/hosts entry):
#    curl -k -H "X-API-Key: YOUR_KEY" https://api.dev.ai-aas.local/v1/status/healthz
#
# 5. NEVER deploy services to the 'system' namespace via manual Helm installs
#    - System namespace is for infrastructure only
#    - Application services belong in 'development', 'staging', or 'production' namespaces
#    - All deployments MUST go through ArgoCD
#
# See docs/ingress-best-practices.md for complete documentation
#

replicaCount: 2

image:
  repository: ghcr.io/otherjamesbrown/api-router-service
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Pod annotations
# logging.enabled: "true" enables Promtail log collection
podAnnotations:
  logging.enabled: "true"

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: api.dev.ai-aas.local
      paths:
        - path: /
          pathType: Prefix
    # IP-based access using nip.io for development/testing
    # Override this in production to use proper DNS
    - host: api.172.232.58.222.nip.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ai-aas-tls
      hosts:
        - api.dev.ai-aas.local
        - api.prod.ai-aas.local
        - api.172.232.58.222.nip.io

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  path: /v1/status/healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /v1/status/readyz
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 10  # Increased to accommodate multiple health checks
  failureThreshold: 6  # More tolerant of intermittent failures

env:
  - name: SERVICE_NAME
    value: api-router-service
  - name: HTTP_PORT
    value: "8080"
  - name: ENVIRONMENT
    value: development
  - name: LOG_LEVEL
    value: info

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# Telemetry configuration
otel:
  enabled: false
  collectorEndpoint: ""
  protocol: grpc
  insecure: true

# Prometheus metrics
prometheus:
  enabled: true
  port: 8080
  path: /metrics

# Redis configuration for rate limiting
redis:
  address: redis-service:6379
  password: ""
  db: 0
  passwordSecretName: ""

# Kafka configuration for usage records
kafka:
  brokers: kafka-service:9092
  topic: usage.records.v1
  auditTopic: audit.router
  brokersSecretName: ""

# Config service (etcd) configuration
configService:
  endpoint: etcd-service:2379
  watchEnabled: true
  cachePath: /tmp/api-router-config.db

# Backend endpoints configuration
backends:
  endpoints: ""

# Rate limiting configuration
rateLimit:
  defaultRPS: 100
  burstSize: 200

# Budget service configuration
budget:
  endpoint: ""
  timeout: 2s
  endpointSecretName: ""

# Pod Disruption Budget - ensures availability during upgrades/maintenance
podDisruptionBudget:
  enabled: true
  minAvailable: 1  # At least 1 pod must remain available
  # maxUnavailable: 1  # Alternative: allow max 1 pod unavailable


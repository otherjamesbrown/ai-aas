# Development environment values for API Router Service
# Deploys to dev cluster with vLLM backend integration
#
# For AI Coding Assistants:
# -------------------------
# This file contains development-specific overrides. Note the ingress configuration
# includes BOTH hostname-based and IP-based (nip.io) access patterns.
#
# IMPORTANT: Update the nip.io hostname (api.172.232.58.222.nip.io) if the
# LoadBalancer IP changes. Find the current IP with:
#   kubectl get svc -n ingress-nginx ingress-nginx-controller \
#     -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
#
# See docs/ingress-best-practices.md for complete documentation

replicaCount: 1  # Single replica for dev

image:
  repository: ghcr.io/otherjamesbrown/api-router-service
  tag: dev
  pullPolicy: Always  # Pull from GHCR
  pullSecrets: []

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"  # Force HTTPS
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: api.dev.ai-aas.local
      paths:
        - path: /
          pathType: Prefix
    # IP-based access using nip.io for development/testing
    # This allows accessing the API via https://api.<LOAD_BALANCER_IP>.nip.io
    - host: api.172.232.58.222.nip.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ai-aas-tls
      hosts:
        - api.dev.ai-aas.local
        - api.172.232.58.222.nip.io

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false  # Disable autoscaling in dev

livenessProbe:
  path: /v1/status/healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /v1/status/readyz
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

env:
  - name: SERVICE_NAME
    value: api-router-service
  - name: HTTP_PORT
    value: "8080"
  - name: ENVIRONMENT
    value: development
  - name: LOG_LEVEL
    value: debug  # Debug logging in dev
  - name: USER_ORG_SERVICE_URL
    value: "http://user-org-service-development-user-org-service.user-org-service.svc.cluster.local:8081"
  - name: USER_ORG_SERVICE_TIMEOUT
    value: "2s"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "otel-collector.monitoring.svc.cluster.local:4317"

# Backend endpoints - configure vLLM service
backends:
  # Format: backend-id:http://service-name.namespace.svc.cluster.local:port/path
  # KServe InferenceServices are exposed via Knative Services
  endpoints: "mistral-7b-instruct:http://mistral-7b-instruct-predictor.development.svc.cluster.local/v1/chat/completions"

# Redis configuration (optional for dev - stubbed if not available)
redis:
  address: ""  # Empty = use in-memory stub rate limiter
  password: ""
  db: 0

# Kafka configuration (optional for dev - stubbed if not available)
kafka:
  brokers: ""  # Empty = use in-memory stub
  topic: usage.records.v1
  auditTopic: audit.router

# Config service (optional for dev - use static config)
configService:
  endpoint: ""  # Empty = use static config
  watchEnabled: false
  cachePath: /tmp/api-router-config.db

# Rate limiting configuration
rateLimit:
  defaultRPS: 100
  burstSize: 200

# Budget service (optional for dev)
budget:
  endpoint: ""  # Empty = allow all requests
  timeout: 2s

# Telemetry
otel:
  enabled: false  # Disable telemetry in dev
  collectorEndpoint: ""
  protocol: grpc
  insecure: true

prometheus:
  enabled: false  # Disable Prometheus monitoring (CRDs not installed in dev)
  port: 8080
  path: /metrics

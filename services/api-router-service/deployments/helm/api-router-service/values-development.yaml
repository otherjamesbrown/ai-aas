# Development environment values for API Router Service
# Deploys to dev cluster with vLLM backend integration
#
# For AI Coding Assistants:
# -------------------------
# This file contains development-specific overrides.
# Domain: api.dev.otherjamesbrown.com (via global.domain.base)
#
# See docs/ingress-best-practices.md for complete documentation

replicaCount: 2  # Multiple replicas for resilience

image:
  repository: ghcr.io/otherjamesbrown/api-router-service
  tag: dev
  pullPolicy: Always  # Pull from GHCR
  pullSecrets: []

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"  # Force HTTPS
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod  # Auto-provision TLS cert
    # CORS is now handled at the application layer (see env vars below)
    # This provides better logging, flexibility, and single source of truth
  hosts:
    - host: api.dev.ai-aas.local
      paths:
        - path: /
          pathType: Prefix
    # Public DNS access via otherjamesbrown.com
    - host: api.dev.otherjamesbrown.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-router-tls
      hosts:
        - api.dev.otherjamesbrown.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

startupProbe:
  path: /v1/status/healthz
  failureThreshold: 30
  periodSeconds: 2
  timeoutSeconds: 5

livenessProbe:
  path: /v1/status/healthz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /v1/status/readyz
  initialDelaySeconds: 5  # Reduced since startupProbe handles initial startup
  periodSeconds: 5  # Check more frequently for faster recovery
  timeoutSeconds: 10  # Increased for parallel health checks
  failureThreshold: 3  # Faster detection of issues (15s to unready)

env:
  - name: SERVICE_NAME
    value: api-router-service
  - name: HTTP_PORT
    value: "8080"
  - name: ENVIRONMENT
    value: development
  - name: LOG_LEVEL
    value: debug  # Debug logging in dev
  - name: USER_ORG_SERVICE_URL
    value: "http://user-org-service-development-user-org-service.user-org-service.svc.cluster.local:8081"
  - name: USER_ORG_SERVICE_TIMEOUT
    value: "2s"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "otel-collector.monitoring.svc.cluster.local:4317"
  # CORS Configuration (handled at application layer for better control)
  - name: CORS_ENABLED
    value: "true"
  - name: CORS_ALLOWED_ORIGINS
    value: "https://portal.dev.otherjamesbrown.com,https://portal.dev.ai-aas.local,http://localhost:5173,https://localhost:5173"
  - name: CORS_ALLOWED_METHODS
    value: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  - name: CORS_ALLOWED_HEADERS
    value: "Authorization,Content-Type,X-API-Key,X-Correlation-ID,X-CSRF-Token,X-Requested-With,Accept,Origin,Cache-Control"
  - name: CORS_EXPOSED_HEADERS
    value: "X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset,X-Correlation-ID"
  - name: CORS_MAX_AGE
    value: "3600"
  - name: CORS_ALLOW_CREDENTIALS
    value: "true"

# Backend endpoints - configure vLLM service
backends:
  # Format: backend-id:http://service-name.namespace.svc.cluster.local:port
  # KServe InferenceServices are exposed via Knative Services
  #
  # IMPORTANT: Use the -private service on port 8012 (queue-proxy port)
  # - Port 80 on regular services routes through Istio which causes timeouts
  # - Port 8012 on -private services connects directly to the queue-proxy sidecar
  # - This bypasses Istio routing and provides direct pod connectivity
  #
  # Note: Don't include path - it's added by the router based on request type
  endpoints: "mistralai/Mistral-7B-Instruct-v0.3:http://mistral-7b-development-predictor-00001-private.development.svc.cluster.local:8012,unsloth/gpt-oss-20b:http://gpt-oss-20b-development-predictor-00002-private.development.svc.cluster.local:8012"

# Redis configuration
redis:
  address: "redis.development.svc.cluster.local:6379"
  password: ""
  db: 0

# Kafka configuration (optional for dev - stubbed if not available)
kafka:
  brokers: ""  # Empty = use in-memory stub
  topic: usage.records.v1
  auditTopic: audit.router

# Config service (optional for dev - use static config)
configService:
  endpoint: ""  # Empty = use static config
  watchEnabled: false
  cachePath: /tmp/api-router-config.db

# Rate limiting configuration
rateLimit:
  defaultRPS: 100
  burstSize: 200

# Budget service (optional for dev)
budget:
  endpoint: ""  # Empty = allow all requests
  timeout: 2s

# Telemetry
otel:
  enabled: false  # Disable telemetry in dev
  collectorEndpoint: ""
  protocol: grpc
  insecure: true

prometheus:
  enabled: false  # Disable Prometheus monitoring (CRDs not installed in dev)
  port: 8080
  path: /metrics

# Development environment overrides
image:
  repository: ghcr.io/otherjamesbrown/ai-aas/user-org-service
  # Using 'dev' tag to match CI build output for develop branch.
  # Staging uses 'staging' tag, production uses 'latest' tag.
  tag: dev
  pullPolicy: Always

env:
  - name: ENVIRONMENT
    value: development
  - name: LOG_LEVEL
    value: info
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: user-org-service-db-secret
        key: database-url
  - name: REDIS_ADDR
    value: "redis.development.svc.cluster.local:6379"
  - name: OAUTH_HMAC_SECRET
    valueFrom:
      secretKeyRef:
        name: user-org-service-secrets
        key: oauth-hmac-secret
  - name: OAUTH_CLIENT_ID
    value: "user-org-admin"
  - name: OAUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: user-org-service-secrets
        key: oauth-client-secret

service:
  type: ClusterIP
  port: 8081

# Ingress configuration for public access
# Disabled because ingress is managed centrally by ingress-development ArgoCD app
ingress:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

prometheus:
  enabled: false

# Node scheduling - prefer CPU nodes (avoid GPU nodes)
# GPU nodes have taint nvidia.com/gpu=true:NoSchedule
# CPU nodes are in pool 770211, GPU nodes are in pool 776664
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: lke.linode.com/pool-id
              operator: In
              values:
                - "770211"  # CPU node pool

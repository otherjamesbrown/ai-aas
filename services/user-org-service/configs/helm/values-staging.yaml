# Staging environment overrides
# Domain configuration is computed from global.domain.base

global:
  domain:
    base: "staging.otherjamesbrown.com"
    local: "staging.otherjamesbrown.com"
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod

replicaCount: 2

image:
  repository: ghcr.io/otherjamesbrown/ai-aas/user-org-service
  tag: staging
  pullPolicy: Always
  pullSecrets:
    - ghcr-pull-secret

env:
  - name: ENVIRONMENT
    value: staging
  - name: LOG_LEVEL
    value: info
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: user-org-service-db-secret
        key: database-url
  - name: REDIS_ADDR
    value: "redis-master.staging.svc.cluster.local:6379"
  - name: ANALYTICS_SERVICE_URL
    value: "http://analytics-service-staging-analytics-service.analytics-service.svc.cluster.local:8084"
  - name: OAUTH_HMAC_SECRET
    valueFrom:
      secretKeyRef:
        name: user-org-service-secrets
        key: oauth-hmac-secret
  - name: OAUTH_CLIENT_ID
    value: "user-org-admin"
  - name: OAUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: user-org-service-secrets
        key: oauth-client-secret

service:
  type: ClusterIP
  port: 8081

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

migrations:
  enabled: true

prometheus:
  enabled: true

# External ingress for CLI access
ingress:
  enabled: true
  className: nginx
  subdomain: user-org
  annotations: {}

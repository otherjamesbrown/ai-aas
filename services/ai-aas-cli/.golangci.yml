# golangci-lint configuration for ai-aas-cli
# Aligned with platform constitution and existing Go services

run:
  timeout: 5m
  tests: true
  modules-download-mode: mod

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional linters per constitution
    - gofmt
    - goimports
    - revive
    - gosec
    - misspell
    - unconvert
    - unparam
    - prealloc
    - exportloopref
    - gocritic
    - nilerr
    - bodyclose
    - contextcheck
    - noctx

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/otherjamesbrown/ai-aas
  govet:
    check-shadowing: true
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: increment-decrement
      - name: var-naming
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
  gosec:
    excludes:
      - G104  # Unhandled errors (handled by errcheck)
      - G304  # File path from variable (acceptable for CLI)
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam  # CLI often passes large config structs

issues:
  exclude-rules:
    # Ignore certain linters in test files
    - path: _test\.go
      linters:
        - gosec
        - gocritic
        - errcheck
    # Allow long lines in generated code
    - path: internal/output/
      linters:
        - lll
  max-issues-per-linter: 50
  max-same-issues: 10

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true


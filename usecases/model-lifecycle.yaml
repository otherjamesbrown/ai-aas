feature: Model Lifecycle
description: |
  Model lifecycle management enables platform operators to deploy, scale, monitor,
  and retire AI model deployments across environments. These operations work with
  AIModel custom resources and KServe InferenceServices managed by the ai-model-operator.

  Operators use the ai-aas-cli to perform routine deployment operations without
  needing direct kubectl access to Kubernetes clusters.

dependencies:
  - usecases/authentication.yaml

usecases:
  - id: UC-MLC-001
    title: Deploy Model from Registry
    interface: cli
    status: active
    bead: null

    description: |
      A platform operator wants to deploy a registered model to a target environment
      (development, staging, or production). The model must already be registered in
      the model registry and optionally cached in object storage.

      The deployment creates an AIModel custom resource that the ai-model-operator
      reconciles into a KServe InferenceService with appropriate resource allocations.
      A routing policy is automatically created to make the model accessible via the
      API Router.

    actor: Platform Operator

    preconditions:
      - Model is registered in the model registry
      - Platform operator has API credentials configured
      - Target environment kubeconfig is configured in CLI
      - Model is cached in S3 or HuggingFace access is available

    depends_on:
      - UC-AUTH-001

    acceptance_criteria:
      - id: AC-01
        criterion: Deploy model with default settings
        given: Model "llama-7b" is registered and cached
        when: Operator runs `ai-aas-cli model deploy create llama-7b -e development`
        then:
          - AIModel CR is created in development namespace
          - Deployment configuration is displayed (runtime, resources, replicas)
          - Global routing policy is created automatically
          - Success message with next steps is shown
          - Exit code is 0

      - id: AC-02
        criterion: Deploy model with custom resources
        given: Model requires specific GPU and memory allocation
        when: Operator runs `ai-aas-cli model deploy create llama-70b -e development --gpu-count 4 --memory 96`
        then:
          - AIModel CR is created with 4 GPUs and 96GB memory
          - Resource configuration is displayed before creation
          - Exit code is 0

      - id: AC-03
        criterion: Deploy with auto-scaling configuration
        given: Production environment requires auto-scaling
        when: Operator runs `ai-aas-cli model deploy create mistral-7b -e production --min-replicas 2 --max-replicas 5`
        then:
          - AIModel CR is created with min=2, max=5 replicas
          - Scaling configuration is displayed
          - Exit code is 0

      - id: AC-04
        criterion: Deploy without routing policy
        given: Operator wants to test deployment before exposing to traffic
        when: Operator runs `ai-aas-cli model deploy create llama-7b -e development --no-routing-policy`
        then:
          - AIModel CR is created successfully
          - No routing policy is created
          - Message explains manual policy creation if needed
          - Exit code is 0

      - id: AC-05
        criterion: Wait for deployment to be ready
        given: Operator wants confirmation deployment is operational
        when: Operator runs `ai-aas-cli model deploy create llama-7b -e development --wait`
        then:
          - Command blocks until AIModel phase is "Ready"
          - Progress indicator shows deployment status
          - Final status shows ready replicas and inference endpoint
          - Exit code is 0 only if deployment succeeds

      - id: AC-06
        criterion: Reject deployment to unconfigured environment
        given: Environment "staging" is not configured in CLI
        when: Operator runs `ai-aas-cli model deploy create llama-7b -e staging`
        then:
          - Command fails with exit code 3 (config error)
          - Error message indicates environment not configured
          - Suggestion to configure environment is shown

      - id: AC-07
        criterion: Reject deployment of unregistered model
        given: Model "unknown-model" is not in the registry
        when: Operator runs `ai-aas-cli model deploy create unknown-model -e development`
        then:
          - Command fails with exit code 5 (not found)
          - Error message indicates model not found in registry
          - Suggestion to register model is shown

    in_scope:
      - Creating AIModel custom resource
      - Configuring runtime, resources, and replicas
      - Validating model exists in registry
      - Checking cache exists before deployment
      - Automatically creating global routing policy
      - Waiting for deployment to be ready (optional)
      - Displaying deployment configuration

    out_of_scope:
      - Registering models (UC-MLC-006)
      - Caching models (separate model cache operations)
      - Modifying existing deployments (UC-MLC-007)
      - Deleting deployments (UC-MLC-004)
      - Creating custom routing policies (UC-RTG-001)
      - Managing Kubernetes resources directly

    must_not:
      - Deploy without validating model exists in registry
      - Create deployment without operator reconciliation
      - Modify InferenceService directly (operator manages it)
      - Expose internal Kubernetes implementation details

  - id: UC-MLC-002
    title: Scale Model Deployment
    interface: cli
    status: active
    bead: null

    description: |
      A platform operator needs to adjust the number of replicas for a deployed
      model in response to load changes or capacity planning. This operation
      modifies the InferenceService replica count to scale up or down.

      Scaling changes take effect within seconds to minutes depending on the
      runtime's startup time. Traffic is automatically load-balanced across replicas.

    actor: Platform Operator

    preconditions:
      - Model is already deployed in target environment
      - Platform operator has API credentials configured
      - Target environment kubeconfig is configured

    depends_on:
      - UC-MLC-001

    acceptance_criteria:
      - id: AC-01
        criterion: Scale deployment to specific replica count
        given: Model "llama-7b" is deployed with 1 replica in development
        when: Operator runs `ai-aas-cli model deploy scale llama-7b -e development --replicas 3`
        then:
          - Current and target replica counts are displayed
          - InferenceService is scaled to 3 replicas
          - Success message confirms scaling operation
          - Exit code is 0

      - id: AC-02
        criterion: Scale down to reduce costs
        given: Model "mistral-7b" is running 5 replicas
        when: Operator runs `ai-aas-cli model deploy scale mistral-7b -e development --replicas 1`
        then:
          - Scaling operation reduces replicas to 1
          - Current status shows the scale-down
          - Exit code is 0

      - id: AC-03
        criterion: Reject scaling non-existent deployment
        given: Model "unknown-model" is not deployed
        when: Operator runs `ai-aas-cli model deploy scale unknown-model -e development --replicas 2`
        then:
          - Command fails with exit code 5 (not found)
          - Error message indicates deployment not found
          - Suggestion to deploy first is shown

    in_scope:
      - Modifying InferenceService replica count
      - Displaying current and target replica counts
      - Validating deployment exists

    out_of_scope:
      - Auto-scaling configuration (UC-MLC-001)
      - Horizontal Pod Autoscaler (HPA) management
      - Vertical scaling (changing GPU/memory)
      - Load testing to determine scale needs

    must_not:
      - Scale to 0 replicas (use delete instead)
      - Bypass Kubernetes API for scaling
      - Modify resource limits during scaling

  - id: UC-MLC-003
    title: View Deployment Status
    interface: cli
    status: active
    bead: null

    description: |
      A platform operator wants to check the current status of a deployed model
      to verify it's operational, troubleshoot issues, or monitor replica counts.

      The status shows InferenceService readiness, replica counts, URL, and
      condition details from Kubernetes.

    actor: Platform Operator

    preconditions:
      - Model is deployed in target environment
      - Platform operator has API credentials configured
      - Target environment kubeconfig is configured

    depends_on:
      - UC-MLC-001

    acceptance_criteria:
      - id: AC-01
        criterion: Show deployment status in table format
        given: Model "llama-7b" is deployed and ready
        when: Operator runs `ai-aas-cli model deploy status llama-7b -e development`
        then:
          - Deployment name and namespace are displayed
          - Ready status shows true with checkmark icon
          - Replica counts show ready/total (e.g., "2/2 ready")
          - Inference URL is displayed
          - Conditions list shows recent state transitions
          - Exit code is 0

      - id: AC-02
        criterion: Show status as JSON
        given: Operator wants machine-readable output
        when: Operator runs `ai-aas-cli model deploy status llama-7b -e development --format json`
        then:
          - Output is valid JSON object
          - JSON includes ready, replicas, readyReplicas, url, conditions
          - Exit code is 0

      - id: AC-03
        criterion: Show status of failing deployment
        given: Model deployment is not ready due to pod errors
        when: Operator runs `ai-aas-cli model deploy status llama-7b -e development`
        then:
          - Ready status shows false with X icon
          - Conditions show error reasons (e.g., "ImagePullBackOff")
          - Suggested next steps include checking logs and events
          - Exit code is 0 (status retrieved successfully)

      - id: AC-04
        criterion: Handle non-existent deployment
        given: Model "unknown-model" is not deployed
        when: Operator runs `ai-aas-cli model deploy status unknown-model -e development`
        then:
          - Command fails with exit code 5 (not found)
          - Error message indicates deployment not found
          - Suggestion to deploy is shown

    in_scope:
      - Displaying InferenceService status fields
      - Showing replica counts and readiness
      - Listing Kubernetes conditions
      - Table and JSON output formats
      - Suggesting next troubleshooting steps

    out_of_scope:
      - Showing pod-level details (use troubleshoot commands)
      - Displaying resource utilization metrics
      - Showing request logs or traces
      - Real-time log streaming

    must_not:
      - Modify deployment state while checking status
      - Require authentication to backend services
      - Cache stale status information

  - id: UC-MLC-004
    title: Retire Model Deployment
    interface: cli
    status: active
    bead: null

    description: |
      A platform operator wants to remove a model deployment from an environment.
      This might be due to the model being deprecated, replaced by a better version,
      or no longer needed.

      The deletion removes the AIModel CR, which triggers the operator to clean up
      the InferenceService. Model cache files are preserved for future redeployment.

    actor: Platform Operator

    preconditions:
      - Model is deployed in target environment
      - Platform operator has API credentials configured
      - Target environment kubeconfig is configured

    depends_on:
      - UC-MLC-001

    acceptance_criteria:
      - id: AC-01
        criterion: Delete deployment with confirmation
        given: Model "llama-7b" is deployed in development
        when: Operator runs `ai-aas-cli model deploy delete llama-7b -e development` and confirms with "y"
        then:
          - Current deployment status is displayed
          - User is prompted "Are you sure? [y/N]:"
          - After confirmation, AIModel CR is deleted
          - Success message indicates deletion initiated
          - Note explains cache is preserved
          - Exit code is 0

      - id: AC-02
        criterion: Force delete without confirmation
        given: Operator wants to skip interactive prompt
        when: Operator runs `ai-aas-cli model deploy delete llama-7b -e development --force`
        then:
          - No confirmation prompt is shown
          - AIModel CR is deleted immediately
          - Success message is displayed
          - Exit code is 0

      - id: AC-03
        criterion: Wait for deletion to complete
        given: Operator wants confirmation cleanup finished
        when: Operator runs `ai-aas-cli model deploy delete llama-7b -e development --force --wait`
        then:
          - Deletion is initiated
          - Command waits for operator to clean up resources
          - Message confirms deletion complete
          - Exit code is 0

      - id: AC-04
        criterion: Cancel deletion on negative confirmation
        given: Operator decides not to delete
        when: Operator runs `ai-aas-cli model deploy delete llama-7b -e development` and types "n"
        then:
          - Message shows "Cancelled."
          - No resources are deleted
          - Exit code is 0

      - id: AC-05
        criterion: Handle non-existent deployment gracefully
        given: Model "unknown-model" is not deployed
        when: Operator runs `ai-aas-cli model deploy delete unknown-model -e development`
        then:
          - Message shows "Deployment unknown-model-development not found in development"
          - No error is raised
          - Exit code is 0

    in_scope:
      - Deleting AIModel custom resource
      - Prompting for confirmation (unless --force)
      - Waiting for cleanup (optional --wait)
      - Preserving model cache files
      - Displaying current deployment status before deletion

    out_of_scope:
      - Deleting cached model files (separate operation)
      - Removing model from registry (separate operation)
      - Deleting routing policies (manual cleanup required)
      - Backing up deployment configuration

    must_not:
      - Delete without confirmation unless --force specified
      - Remove model cache files automatically
      - Delete deployments across multiple environments at once
      - Allow deletion of production deployments without explicit environment flag

  - id: UC-MLC-005
    title: Rollback Deployment
    interface: cli
    status: active
    bead: null

    description: |
      A platform operator needs to perform a rolling restart of a model deployment
      to pick up new model weights, recover from issues, or refresh pods after
      configuration changes.

      This triggers a new rollout of InferenceService pods without changing the
      deployment configuration. Traffic is gradually shifted to new pods during
      the restart.

    actor: Platform Operator

    preconditions:
      - Model is deployed in target environment
      - Platform operator has API credentials configured
      - Target environment kubeconfig is configured

    depends_on:
      - UC-MLC-001

    acceptance_criteria:
      - id: AC-01
        criterion: Trigger rolling restart
        given: Model "llama-7b" is deployed in development
        when: Operator runs `ai-aas-cli model deploy restart llama-7b -e development`
        then:
          - Deployment name and namespace are displayed
          - Message confirms "Rolling restart triggered"
          - Suggested next steps include checking status and logs
          - Exit code is 0

      - id: AC-02
        criterion: Restart and wait for completion
        given: Operator wants confirmation pods are ready after restart
        when: Operator runs `ai-aas-cli model deploy restart llama-7b -e development --wait`
        then:
          - Restart is initiated
          - Message shows "Waiting for pods to be ready..."
          - Command blocks until all pods are ready
          - Success message confirms all pods ready
          - Exit code is 0

      - id: AC-03
        criterion: Reject restart of non-existent deployment
        given: Model "unknown-model" is not deployed
        when: Operator runs `ai-aas-cli model deploy restart unknown-model -e development`
        then:
          - Command fails with exit code 5 (not found)
          - Error message indicates deployment not found
          - Suggestion to deploy first is shown

    in_scope:
      - Triggering InferenceService pod restart
      - Waiting for restart completion (optional)
      - Displaying restart progress
      - Validating deployment exists

    out_of_scope:
      - Modifying deployment configuration during restart
      - Updating model version/revision (separate operation)
      - Performing blue/green deployment
      - Rolling back to previous configuration

    must_not:
      - Cause downtime during restart (rolling restart only)
      - Modify resource allocations during restart
      - Clear model cache during restart
      - Skip operator reconciliation

  - id: UC-MLC-010
    title: Deploy Model via GitOps
    interface: gitops
    status: active
    bead: aas-fr6tz

    description: |
      The platform enforces GitOps-only model deployment. AIModel resources can only
      be created by ArgoCD syncing from the ai-aas-config repository. This ensures
      all model deployments are version-controlled, auditable, and reproducible.

      This use case validates the end-to-end GitOps deployment flow from config
      commit to model readiness.

    actor: Platform Operator

    preconditions:
      - ai-aas-config repository is accessible
      - ArgoCD is configured to sync from ai-aas-config
      - Kyverno policy blocks non-ArgoCD AIModel creation
      - Target model (TinyLlama) image is available

    depends_on:
      - UC-AUTH-001

    acceptance_criteria:
      - id: AC-01
        criterion: AIModel config added to ai-aas-config creates deployment
        given: ai-aas-config/environments/development/models/ is synced by ArgoCD
        when: Operator commits tinyllama-test.yaml to ai-aas-config develop branch
        then:
          - ArgoCD detects the change within 3 minutes
          - AIModel CR is created in development namespace
          - AIModel matches the committed YAML spec
          - Exit code is 0

      - id: AC-02
        criterion: Deployed model reaches Ready phase
        given: AIModel CR exists from GitOps sync
        when: Operator waits for model to deploy (up to 10 minutes)
        then:
          - AIModel phase transitions to Ready
          - InferenceService is created with correct configuration
          - Pod is running and healthy
          - Model is accessible via inference endpoint

      - id: AC-03
        criterion: Non-GitOps AIModel creation is blocked
        given: Kyverno policy is active
        when: Operator attempts to create AIModel via kubectl apply
        then:
          - Kyverno rejects the request
          - Error message explains GitOps-only policy
          - No AIModel is created in cluster

    in_scope:
      - Committing AIModel YAML to ai-aas-config
      - Waiting for ArgoCD sync
      - Verifying AIModel CR creation
      - Verifying model reaches Ready phase
      - Testing inference endpoint

    out_of_scope:
      - Creating AIModel via Admin API (deprecated path)
      - Direct kubectl create/apply (blocked by policy)
      - Model registry operations
      - Routing policy configuration

    must_not:
      - Create AIModel directly in cluster
      - Bypass GitOps workflow
      - Leave test resources after cleanup
      - Modify production configurations

  - id: UC-MLC-011
    title: Remove Model via GitOps
    interface: gitops
    status: active
    bead: aas-fr6tz

    description: |
      When a model configuration is removed from ai-aas-config, ArgoCD's prune
      policy automatically deletes the corresponding AIModel CR. The ai-model-operator
      then cleans up the InferenceService and all associated resources.

      This use case validates complete cleanup with no orphaned resources.

    actor: Platform Operator

    preconditions:
      - Model was deployed via GitOps (UC-MLC-010)
      - ArgoCD has prune: true enabled
      - Model is currently in Ready phase

    depends_on:
      - UC-MLC-010

    acceptance_criteria:
      - id: AC-01
        criterion: Removing config from ai-aas-config triggers deletion
        given: tinyllama-test.yaml exists in ai-aas-config and model is Ready
        when: Operator deletes tinyllama-test.yaml and pushes to develop branch
        then:
          - ArgoCD detects the change within 3 minutes
          - ArgoCD prunes the AIModel CR
          - AIModel is deleted from development namespace

      - id: AC-02
        criterion: Operator cleans up all resources
        given: AIModel CR is deleted by ArgoCD prune
        when: Operator reconciles the deletion (up to 5 minutes)
        then:
          - InferenceService is deleted
          - Associated pods are terminated
          - Services are removed
          - No orphaned resources remain

      - id: AC-03
        criterion: Model no longer accessible via inference
        given: All resources are cleaned up
        when: Client attempts inference request to the deleted model
        then:
          - Request returns 404 or model not found error
          - No stale routing entries remain

    in_scope:
      - Removing AIModel YAML from ai-aas-config
      - Waiting for ArgoCD sync with prune
      - Verifying AIModel CR deletion
      - Verifying InferenceService deletion
      - Verifying no orphaned pods/services

    out_of_scope:
      - Deleting via Admin API (not supported)
      - Direct kubectl delete (bypass check only)
      - Cache cleanup (preserved intentionally)
      - Registry cleanup

    must_not:
      - Leave orphaned InferenceService
      - Leave orphaned pods or services
      - Affect other model deployments
      - Delete resources outside test scope

  - id: UC-MLC-012
    title: Model Visibility Lifecycle (Enable/Disable)
    interface: gitops
    status: active
    bead: aas-ufk6w

    description: |
      Platform operators can control model visibility by toggling the `enabled` field
      in the AIModel configuration. When a model is disabled, it should no longer
      appear in the /v1/models endpoint and inference requests should fail.

      Re-enabling the model should restore visibility and allow inference requests
      to succeed again.

      This use case validates the full enable/disable lifecycle via GitOps.

    actor: Platform Operator

    preconditions:
      - Model is deployed via GitOps and in Ready phase
      - Model is currently enabled and visible in /v1/models
      - ArgoCD is syncing the ai-aas-config repository

    depends_on:
      - UC-MLC-010

    acceptance_criteria:
      - id: AC-01
        criterion: Enabled model appears in /v1/models
        given: Model is deployed with enabled=true
        when: Client requests GET /v1/models
        then:
          - Model appears in the models list
          - Model ID matches the configured external name
          - Exit code is 0

      - id: AC-02
        criterion: Disabling model removes it from /v1/models
        given: Model is currently enabled and visible
        when: Operator updates config to enabled=false and ArgoCD syncs
        then:
          - AIModel CR is updated with enabled=false
          - Model no longer appears in GET /v1/models
          - Routing policy is updated or removed

      - id: AC-03
        criterion: Disabled model rejects inference requests
        given: Model is disabled (enabled=false)
        when: Client sends inference request for the model
        then:
          - Request fails with 404 or model not found error
          - Error message indicates model is not available

      - id: AC-04
        criterion: Re-enabling model restores visibility
        given: Model is currently disabled
        when: Operator updates config to enabled=true and ArgoCD syncs
        then:
          - AIModel CR is updated with enabled=true
          - Model reappears in GET /v1/models
          - Inference requests succeed again

    in_scope:
      - Testing enable/disable via GitOps config changes
      - Verifying /v1/models visibility changes
      - Verifying inference request behavior changes
      - Waiting for ArgoCD sync after config changes

    out_of_scope:
      - Direct kubectl patching of enabled field
      - Admin API enable/disable (if available)
      - Scaling to 0 replicas (different from disable)
      - Routing policy manual management

    must_not:
      - Delete the AIModel CR when disabling
      - Delete the InferenceService when disabling
      - Affect other enabled models
      - Leave model in inconsistent state

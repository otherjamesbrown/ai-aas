feature: Platform Operations
description: |
  Platform operations allows platform operators to monitor and manage model
  deployments across the cluster. Operators can view deployment status, track
  progress through deployment phases, and troubleshoot failed or stuck deployments.

  These workflows are essential for GitOps-based deployments where operators need
  visibility into the cluster state without direct kubectl access.

dependencies:
  - usecases/authentication.yaml

usecases:
  - id: UC-OPS-001
    title: Monitor Model Deployment Status
    interface: cli
    status: active
    bead: null

    description: |
      A platform operator wants to monitor the deployment status of a model to
      understand where it is in the deployment lifecycle. This is critical for
      GitOps workflows where deployments are triggered by configuration changes
      and operators need visibility into progress.

      The deployment lifecycle includes phases such as: Pending, ImagePulling,
      ModelDownloading, Starting, Ready. Operators need to see which phase is
      current, what phases have completed, and why a deployment might be stuck.

    actor: Platform Operator

    preconditions:
      - User has valid platform admin API key
      - User is authenticated with the CLI
      - Model deployment exists in the cluster

    depends_on:
      - UC-AUTH-001

    acceptance_criteria:
      - id: AC-01
        criterion: Show current deployment phase
        given: Model "llama-7b" is deployed and in "ModelDownloading" phase
        when: User runs `ai-aas-cli model deploy status llama-7b`
        then:
          - Current phase "ModelDownloading" is displayed
          - Phase start time is shown
          - Exit code is 0

      - id: AC-02
        criterion: Show deployment timeline with phase progression
        given: Model "llama-7b" has completed "ImagePulling" and is in "ModelDownloading"
        when: User runs `ai-aas-cli model deploy status llama-7b`
        then:
          - Timeline shows completed phases with checkmarks
          - Current phase is highlighted
          - Upcoming phases are listed
          - Duration of completed phases is shown

      - id: AC-03
        criterion: Show blocking reason when deployment is stuck
        given: Model "llama-7b" is stuck in "Pending" due to insufficient GPU resources
        when: User runs `ai-aas-cli model deploy status llama-7b`
        then:
          - Current phase "Pending" is displayed
          - Blocking reason "Insufficient GPU resources" is shown
          - Suggestion to check node availability is provided

      - id: AC-04
        criterion: Show download progress during model download phase
        given: Model "llama-7b" is downloading model weights (50% complete)
        when: User runs `ai-aas-cli model deploy status llama-7b`
        then:
          - Download progress percentage is shown
          - Downloaded size vs total size is displayed
          - Estimated time remaining is shown

      - id: AC-05
        criterion: Watch mode for live status updates
        given: Model "llama-7b" is currently deploying
        when: User runs `ai-aas-cli model deploy status llama-7b --watch`
        then:
          - Status updates in real-time
          - Screen refreshes when phase changes
          - Progress indicators update continuously
          - User can exit with Ctrl+C

      - id: AC-06
        criterion: Show readiness probe timing
        given: Model "llama-7b" is in "Starting" phase with readiness probe configured
        when: User runs `ai-aas-cli model deploy status llama-7b`
        then:
          - Expected startup time based on probe config is shown
          - Time since pod started is displayed
          - Number of probe attempts is shown

      - id: AC-07
        criterion: Handle model not found gracefully
        given: No deployment exists for model "nonexistent-model"
        when: User runs `ai-aas-cli model deploy status nonexistent-model`
        then:
          - Command fails with exit code 5 (not found)
          - Error message indicates deployment not found
          - Suggestion to run `ai-aas-cli model deploy list` is shown

    in_scope:
      - Displaying current deployment phase
      - Showing phase timeline and progression
      - Displaying blocking reasons for stuck deployments
      - Showing download progress during model download
      - Real-time status updates with --watch flag
      - Displaying readiness probe information
      - Graceful error handling for non-existent deployments

    out_of_scope:
      - Starting or stopping deployments (UC-OPS-004)
      - Modifying deployment configuration
      - Viewing historical deployment attempts
      - Comparing deployment status across environments
      - Cost or resource consumption metrics

    must_not:
      - Modify deployment state or configuration
      - Expose internal Kubernetes resource names
      - Show credentials or secrets
      - Auto-retry or auto-heal failed deployments
      - Block on status check (must always return promptly except --watch)

  - id: UC-OPS-002
    title: List All Model Deployments
    interface: cli
    status: active
    bead: null

    description: |
      A platform operator wants to see an overview of all model deployments
      in the cluster. This provides a dashboard view of deployment health
      and helps identify which models need attention.

      The list shows deployment status at a glance, allowing operators to
      quickly identify blocked, failed, or degraded deployments that require
      investigation.

    actor: Platform Operator

    preconditions:
      - User has valid platform admin API key
      - User is authenticated with the CLI

    depends_on:
      - UC-AUTH-001

    acceptance_criteria:
      - id: AC-01
        criterion: List all deployments with status summary
        given: Multiple models are deployed in various phases
        when: User runs `ai-aas-cli model deploy list`
        then:
          - All model deployments are listed
          - Each shows model name, current phase, and age
          - Status is color-coded (green=Ready, yellow=Pending, red=Failed)
          - Output is formatted as a table
          - Exit code is 0

      - id: AC-02
        criterion: Filter deployments by phase
        given: Multiple models are deployed, some Ready, some Pending
        when: User runs `ai-aas-cli model deploy list --phase Pending`
        then:
          - Only deployments in "Pending" phase are shown
          - Filter is case-insensitive
          - Exit code is 0

      - id: AC-03
        criterion: Show blocked deployments prominently
        given: Some deployments are blocked due to resource constraints
        when: User runs `ai-aas-cli model deploy list`
        then:
          - Blocked deployments are marked with warning indicator
          - Summary shows count of blocked deployments
          - Blocked reason summary is shown inline

      - id: AC-04
        criterion: Handle no deployments gracefully
        given: No model deployments exist in the cluster
        when: User runs `ai-aas-cli model deploy list`
        then:
          - Message indicates no deployments found
          - Exit code is 0

      - id: AC-05
        criterion: JSON output format for automation
        given: Multiple models are deployed
        when: User runs `ai-aas-cli model deploy list --json`
        then:
          - Output is valid JSON array
          - Each deployment includes name, phase, age, blocked status
          - Exit code is 0

    in_scope:
      - Listing all model deployments
      - Displaying deployment status summary
      - Filtering by deployment phase
      - Highlighting blocked deployments
      - Table and JSON output formats

    out_of_scope:
      - Detailed deployment information (use UC-OPS-001)
      - Pagination for large deployment lists
      - Sorting by different fields
      - Filtering by model name or namespace
      - Historical deployment information

    must_not:
      - Modify any deployment state
      - Show deployments from other clusters
      - Expose internal Kubernetes resource details
      - Show resource consumption metrics
      - Auto-refresh without --watch flag

  - id: UC-OPS-003
    title: Troubleshoot Failed Deployment
    interface: cli
    status: active
    bead: null

    description: |
      A platform operator needs to diagnose why a model deployment has failed
      or is stuck. This use case provides diagnostic information to help
      identify the root cause without requiring direct kubectl access.

      The troubleshoot command aggregates relevant information including
      recent events, configuration issues, and common failure patterns
      to accelerate debugging.

    actor: Platform Operator

    preconditions:
      - User has valid platform admin API key
      - User is authenticated with the CLI
      - Model deployment exists (in any state)

    depends_on:
      - UC-AUTH-001
      - UC-OPS-001

    acceptance_criteria:
      - id: AC-01
        criterion: Show deployment diagnostics and recent events
        given: Model "llama-7b" deployment is failing with CrashLoopBackOff
        when: User runs `ai-aas-cli model troubleshoot llama-7b`
        then:
          - Recent events from the past hour are displayed
          - Error messages from pod logs are shown
          - Container restart count is displayed
          - Last termination reason is shown

      - id: AC-02
        criterion: Check and report configuration validity
        given: Model "llama-7b" has invalid resource request (requesting more GPU than available)
        when: User runs `ai-aas-cli model troubleshoot llama-7b`
        then:
          - Configuration validation results are shown
          - Invalid configuration is flagged with explanation
          - Resource requests vs cluster capacity is displayed
          - Suggestion to adjust configuration is provided

      - id: AC-03
        criterion: Identify scheduling issues
        given: Model "llama-7b" cannot be scheduled due to missing tolerations
        when: User runs `ai-aas-cli model troubleshoot llama-7b`
        then:
          - Scheduling failure reason is identified
          - Missing tolerations or node selectors are flagged
          - Available nodes and their taints are summarized
          - Suggestion for toleration fix is provided

      - id: AC-04
        criterion: Check image pull issues
        given: Model "llama-7b" is failing due to image pull error
        when: User runs `ai-aas-cli model troubleshoot llama-7b`
        then:
          - Image pull error is identified
          - Image name and registry are shown
          - Credential status is checked and reported
          - Suggestion to verify registry access is provided

      - id: AC-05
        criterion: Handle healthy deployment gracefully
        given: Model "llama-7b" is deployed and running successfully
        when: User runs `ai-aas-cli model troubleshoot llama-7b`
        then:
          - Message indicates deployment is healthy
          - Key health metrics are shown (uptime, restarts, readiness)
          - Exit code is 0

      - id: AC-06
        criterion: JSON output for automation
        given: Model "llama-7b" has deployment issues
        when: User runs `ai-aas-cli model troubleshoot llama-7b --json`
        then:
          - Output is valid JSON object
          - Includes events, errors, diagnostics arrays
          - Includes overall health status
          - Exit code reflects deployment health (0=healthy, 1=unhealthy)

    in_scope:
      - Displaying recent deployment events
      - Checking configuration validity
      - Identifying scheduling issues
      - Detecting image pull problems
      - Reporting container crash reasons
      - Providing actionable suggestions
      - Table and JSON output formats

    out_of_scope:
      - Automatic remediation of issues
      - Viewing full pod logs (use kubectl for detailed logs)
      - Comparing configurations across deployments
      - Network connectivity testing
      - Performance profiling

    must_not:
      - Modify deployment state or configuration
      - Auto-remediate detected issues
      - Expose full secrets or credentials
      - Show raw Kubernetes manifests
      - Execute arbitrary kubectl commands

# KServe InferenceService for Mistral-7B-Instruct-v0.2
# Public model - no HuggingFace token required
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: mistral-7b-instruct
  namespace: development
  labels:
    app: vllm-inference
    model: mistral-7b-instruct
    version: v0.2
    environment: development
  annotations:
    serving.kserve.io/deploymentMode: "Serverless"
    # CRITICAL: Allow 6 minutes for model to load into GPU memory
    # Without this, Knative kills the pod after ~2 minutes (default progress deadline)
    serving.knative.dev/progress-deadline: "360s"
    # Knative autoscaling configuration - optimized for GPU inference
    autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"  # Use Knative Pod Autoscaler
    autoscaling.knative.dev/metric: "concurrency"  # Scale based on concurrent requests
    autoscaling.knative.dev/target: "1"  # Target 1 concurrent request per pod (aggressive)
    autoscaling.knative.dev/scaleDownDelay: "2m"  # Wait 2 minutes before scaling down
    autoscaling.knative.dev/window: "30s"  # 30s window for faster autoscaling decisions
    autoscaling.knative.dev/panicThreshold: "150"  # Panic at 150% of target (1.5 concurrent)
    autoscaling.knative.dev/panicWindowPercentage: "10"  # React quickly (10% of window = 3s)
    autoscaling.knative.dev/targetUtilizationPercentage: "70"  # Target 70% utilization
spec:
  predictor:
    # Keep 1 replica warm for testing
    minReplicas: 1
    maxReplicas: 3

    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.6.3
        args:
          - --model=mistralai/Mistral-7B-Instruct-v0.2
          - --dtype=float16
          - --max-model-len=4096
          - --gpu-memory-utilization=0.9
          - --trust-remote-code
          - --served-model-name=mistral-7b-instruct
        env:
          - name: HF_HOME
            value: /tmp/hf_home
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: "32Gi"
            nvidia.com/gpu: 1
        ports:
          - containerPort: 8000
            name: http1
            protocol: TCP
        # Health probes to prevent traffic before model is loaded
        # NOTE: KServe/Knative does NOT support startupProbe - it will be ignored!
        # We must use readinessProbe with long enough timeout for initial model loading
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30  # Give model time to start loading
          periodSeconds: 10
          failureThreshold: 36  # 30s + 36×10s = 6 min max for 7B model
          timeoutSeconds: 5
        # Liveness probe with lenient settings to avoid killing during startup
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120  # Don't check for first 2 minutes
          periodSeconds: 30
          failureThreshold: 6  # Allow 3 minutes of downtime
          timeoutSeconds: 5

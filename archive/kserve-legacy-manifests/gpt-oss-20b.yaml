# KServe InferenceService for GPT-OSS-20B
# Optimized for NVIDIA RTX 4000 Ada (20GB VRAM)
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: gpt-oss-20b
  namespace: development
  labels:
    app: vllm-inference
    model: gpt-oss-20b
    version: v1.0
    environment: development
  annotations:
    serving.kserve.io/deploymentMode: "Serverless"
    # CRITICAL: Allow 15 minutes for model to load into GPU memory
    # Without this, Knative kills the pod after ~2 minutes (default progress deadline)
    serving.knative.dev/progress-deadline: "900s"
    # Knative autoscaling configuration - optimized for GPU inference
    autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"  # Use Knative Pod Autoscaler
    autoscaling.knative.dev/metric: "concurrency"  # Scale based on concurrent requests
    autoscaling.knative.dev/target: "1"  # Target 1 concurrent request per pod (aggressive)
    autoscaling.knative.dev/scaleDownDelay: "2m"  # Wait 2 minutes before scaling down
    autoscaling.knative.dev/window: "30s"  # 30s window for faster autoscaling decisions
    autoscaling.knative.dev/panicThreshold: "150"  # Panic at 150% of target (1.5 concurrent)
    autoscaling.knative.dev/panicWindowPercentage: "10"  # React quickly (10% of window = 3s)
    autoscaling.knative.dev/targetUtilizationPercentage: "70"  # Target 70% utilization
spec:
  predictor:
    # Keep 1 replica warm for testing
    minReplicas: 1
    maxReplicas: 2  # Limited to 2 for dev environment

    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.10.2
        args:
          - --model=openai/gpt-oss-20b
          - --served-model-name=gpt-oss-20b
          # WARNING: SECURITY RISK - --trust-remote-code allows arbitrary code execution
          # from the model repository. Only use with models from trusted sources.
          # This flag is required for certain model architectures that include custom code.
          - --trust-remote-code
          # GPT-OSS specific optimizations
          - --async-scheduling  # Recommended for Ampere GPUs (RTX 4000 Ada)
          - --no-enable-prefix-caching  # Recommended for GPT-OSS
          # Resource configuration
          - --max-model-len=8192  # GPT-OSS supports longer context
          - --gpu-memory-utilization=0.9
          - --max-num-seqs=256  # Batch size for throughput
        env:
          - name: HF_HOME
            value: /tmp/hf_home
          # Optional: Add HuggingFace token if model is private
          # - name: HUGGING_FACE_HUB_TOKEN
          #   valueFrom:
          #     secretKeyRef:
          #       name: huggingface-secret
          #       key: token
        resources:
          requests:
            cpu: "3"  # Reduced to fit available cluster resources
            memory: "14Gi"  # Reduced to fit available cluster resources
            nvidia.com/gpu: 1
          limits:
            cpu: "6"
            memory: "28Gi"
            nvidia.com/gpu: 1
        ports:
          - containerPort: 8000
            name: http1
            protocol: TCP
        # Health probes to prevent traffic before model is loaded
        # NOTE: KServe/Knative does NOT support startupProbe - it will be ignored!
        # We must use readinessProbe with long enough timeout for initial model loading
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60  # Give model time to start loading
          periodSeconds: 10
          failureThreshold: 90  # 60s + 90×10s = 960s = 16 min max for 20B model
          timeoutSeconds: 5
        # Liveness probe with very lenient settings to avoid killing during long operations
        # This will allow up to 20 minutes of unresponsiveness before killing the pod
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 600  # Don't check for first 10 minutes
          periodSeconds: 60         # Check every minute
          failureThreshold: 10      # Allow 10 failures = 10 minutes of downtime
          timeoutSeconds: 5

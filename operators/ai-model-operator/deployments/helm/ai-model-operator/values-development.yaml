# Development environment values for AI Model Operator
replicaCount: 1

image:
  repository: ghcr.io/otherjamesbrown/ai-aas/ai-model-operator
  pullPolicy: Always
  tag: "develop"  # Use develop branch builds

# Development gets slightly more resources for debugging
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Environment-specific configuration
env:
  - name: LOG_LEVEL
    value: "debug"

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ai-model-operator.fullname" . }}-manager-role
  labels:
    {{- include "ai-model-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - aimodel.ai-aas.io
  resources:
  - aimodels
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - aimodel.ai-aas.io
  resources:
  - aimodels/finalizers
  verbs:
  - update
- apiGroups:
  - aimodel.ai-aas.io
  resources:
  - aimodels/status
  verbs:
  - get
  - patch
  - update
# ModelRecipe permissions - needed for recipeRef resolution
- apiGroups:
  - aimodel.ai-aas.io
  resources:
  - modelrecipes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - update
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - serving.kserve.io
  resources:
  - inferenceservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - serving.kserve.io
  resources:
  - inferenceservices/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ai-model-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "ai-model-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ai-model-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "ai-model-operator.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}

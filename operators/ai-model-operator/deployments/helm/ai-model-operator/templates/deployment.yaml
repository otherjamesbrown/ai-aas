apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-model-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-model-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-model-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: manager
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ai-model-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: manager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ai-model-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--metrics-bind-address={{ .Values.manager.metrics.bindAddress }}"
            - "--health-probe-bind-address={{ .Values.manager.healthProbe.bindAddress }}"
            - "--leader-elect={{ .Values.manager.leaderElection.enabled }}"
            - "--leader-election-id={{ .Values.manager.leaderElection.id }}"
          env:
            - name: S3_CREDENTIALS_SECRET_NAME
              value: {{ .Values.s3CredentialsSecretName }}
            - name: HUGGINGFACE_TOKEN_SECRET_NAME
              value: {{ .Values.huggingFaceTokenSecretName }}
            - name: MODEL_DOWNLOADER_IMAGE
              value: "{{ .Values.modelDownloaderImage.repository }}:{{ .Values.modelDownloaderImage.tag }}"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 9443
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

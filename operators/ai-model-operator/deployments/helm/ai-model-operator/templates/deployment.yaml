apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-model-operator.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
    {{- include "ai-model-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      control-plane: controller-manager
      {{- include "ai-model-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        control-plane: controller-manager
        {{- include "ai-model-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-model-operator.fullname" . }}-controller-manager
      containers:
      - command:
        - /manager
        args:
        - --leader-elect
        {{- if .Values.downloaderImage }}
        - --downloader-image={{ .Values.downloaderImage }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - --enable-webhook=true
        - --webhook-port={{ .Values.webhook.port }}
        {{- else }}
        - --enable-webhook=false
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: manager
        {{- if .Values.env }}
        env:
          {{- toYaml .Values.env | nindent 10 }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        ports:
        - containerPort: {{ .Values.webhook.port }}
          name: webhook-server
          protocol: TCP
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
      {{- if .Values.webhook.enabled }}
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: {{ include "ai-model-operator.fullname" . }}-webhook-server-cert
      {{- end }}
      terminationGracePeriodSeconds: 10

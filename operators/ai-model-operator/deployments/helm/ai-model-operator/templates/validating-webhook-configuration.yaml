{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "ai-model-operator.fullname" . }}-validating-webhook-configuration
  labels:
    {{- include "ai-model-operator.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "ai-model-operator.fullname" . }}-serving-cert
webhooks:
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    service:
      name: {{ include "ai-model-operator.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-aimodel-ai-aas-io-v1alpha1-aimodel
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  name: vaimodel.kb.io
  rules:
  - apiGroups:
    - aimodel.ai-aas.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - aimodels
  sideEffects: None
{{- end }}

name: AI Model Operator CI

on:
  workflow_dispatch:  # Allow manual triggering
  push:
    branches:
      - main
      - develop
      - staging
    paths:
      - 'operators/ai-model-operator/**'
      - '.github/workflows/ai-model-operator-ci.yml'
  pull_request:
    paths:
      - 'operators/ai-model-operator/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/otherjamesbrown/ai-aas/ai-model-operator

jobs:
  crd-sync-validation:
    name: CRD Sync Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CRD sync between source and Helm chart
        run: |
          set -e

          echo "Validating CRD sync between operator source and Helm chart..."
          echo ""

          SOURCE_DIR="operators/ai-model-operator/config/crd/bases"
          HELM_CRD_DIR="operators/ai-model-operator/deployments/helm/ai-model-operator/crds"

          ERRORS=0

          # Check AIModel CRD
          echo "Checking AIModel CRD..."
          SOURCE_CRD="$SOURCE_DIR/aimodel.ai-aas.io_aimodels.yaml"
          HELM_CRD="$HELM_CRD_DIR/aimodel.yaml"

          if [ ! -f "$SOURCE_CRD" ]; then
            echo "❌ Source CRD not found: $SOURCE_CRD"
            ERRORS=$((ERRORS + 1))
          elif [ ! -f "$HELM_CRD" ]; then
            echo "❌ Helm CRD not found: $HELM_CRD"
            ERRORS=$((ERRORS + 1))
          else
            if ! diff -u "$SOURCE_CRD" "$HELM_CRD"; then
              echo "❌ AIModel CRD is out of sync!"
              echo "   Source: $SOURCE_CRD"
              echo "   Helm:   $HELM_CRD"
              echo ""
              echo "To fix, run: cp $SOURCE_CRD $HELM_CRD"
              ERRORS=$((ERRORS + 1))
            else
              echo "✅ AIModel CRD is in sync"
            fi
          fi

          echo ""

          # Check ModelRecipe CRD
          echo "Checking ModelRecipe CRD..."
          SOURCE_CRD="$SOURCE_DIR/aimodel.ai-aas.io_modelrecipes.yaml"
          HELM_CRD="$HELM_CRD_DIR/modelrecipe.yaml"

          if [ ! -f "$SOURCE_CRD" ]; then
            echo "❌ Source CRD not found: $SOURCE_CRD"
            ERRORS=$((ERRORS + 1))
          elif [ ! -f "$HELM_CRD" ]; then
            echo "❌ Helm CRD not found: $HELM_CRD"
            ERRORS=$((ERRORS + 1))
          else
            if ! diff -u "$SOURCE_CRD" "$HELM_CRD"; then
              echo "❌ ModelRecipe CRD is out of sync!"
              echo "   Source: $SOURCE_CRD"
              echo "   Helm:   $HELM_CRD"
              echo ""
              echo "To fix, run: cp $SOURCE_CRD $HELM_CRD"
              ERRORS=$((ERRORS + 1))
            else
              echo "✅ ModelRecipe CRD is in sync"
            fi
          fi

          echo ""

          if [ $ERRORS -gt 0 ]; then
            echo "❌ Found $ERRORS CRD sync errors"
            echo ""
            echo "CRDs in the Helm chart must match the source CRDs exactly."
            echo "After modifying CRDs, always copy them to the Helm chart:"
            echo "  cp operators/ai-model-operator/config/crd/bases/*.yaml \\"
            echo "     operators/ai-model-operator/deployments/helm/ai-model-operator/crds/"
            exit 1
          fi

          echo "✅ All CRDs are in sync between source and Helm chart"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Run tests
        working-directory: operators/ai-model-operator
        run: |
          go mod download
          go build ./...
          go test ./... -v

      - name: Run go vet
        working-directory: operators/ai-model-operator
        run: go vet ./...

  build-image:
    name: Build and Push Image
    needs: [crd-sync-validation, test]
    if: github.event_name == 'push'  # Only build on push, not PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=sha,format=short
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./operators/ai-model-operator
          file: ./operators/ai-model-operator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

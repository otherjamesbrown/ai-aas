name: AI Model Operator CI

on:
  workflow_dispatch:  # Allow manual triggering
  push:
    branches:
      - main
      - develop
      - staging
    paths:
      - 'operators/ai-model-operator/**'
      - '.github/workflows/ai-model-operator-ci.yml'
  pull_request:
    paths:
      - 'operators/ai-model-operator/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/otherjamesbrown/ai-aas/ai-model-operator

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Run tests
        working-directory: operators/ai-model-operator
        run: |
          go mod download
          go build ./...
          go test ./... -v

      - name: Run go vet
        working-directory: operators/ai-model-operator
        run: go vet ./...

  build-image:
    name: Build and Push Image
    needs: [test]
    if: github.event_name == 'push'  # Only build on push, not PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=sha,format=short
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./operators/ai-model-operator
          file: ./operators/ai-model-operator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

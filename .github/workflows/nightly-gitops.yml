name: Nightly GitOps Tests

on:
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC daily (after nightly UC tests at 2 AM)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development

env:
  GO_VERSION: '1.24.x'
  TEST_TIMEOUT: '30m'
  # Uses existing Linode Object Storage bucket with gitops-results/ prefix
  RESULTS_BUCKET: ai-aas-models
  RESULTS_PREFIX: gitops-results
  # Linode Object Storage endpoint (us-east-1 region)
  S3_ENDPOINT: https://us-east-1.linodeobjects.com

jobs:
  gitops-tests:
    name: GitOps Tests (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        environment: [development]
      fail-fast: false

    steps:
      - name: Checkout ai-aas repository
        uses: actions/checkout@v4
        with:
          path: ai-aas

      - name: Checkout ai-aas-config repository
        uses: actions/checkout@v4
        with:
          repository: otherjamesbrown/ai-aas-config
          token: ${{ secrets.AI_AAS_CONFIG_PAT }}
          ref: develop
          path: ai-aas-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-gitops-${{ hashFiles('ai-aas/tests/usecases/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-gitops-
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          cd ai-aas/tests/usecases
          go mod download
          go mod verify

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.DEV_KUBECONFIG_B64 }}
          KUBE_CONTEXT: ${{ secrets.DEV_KUBE_CONTEXT }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_B64" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

          # Verify kubeconfig works
          kubectl config use-context "$KUBE_CONTEXT"
          kubectl cluster-info

          # Set for test environment
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Configure git credentials for ai-aas-config
        env:
          GIT_PAT: ${{ secrets.AI_AAS_CONFIG_PAT }}
        run: |
          cd ai-aas-config
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Configure credential helper to use PAT
          git config credential.helper store
          echo "https://x-access-token:${GIT_PAT}@github.com" > $HOME/.git-credentials

      - name: Configure test environment
        run: |
          ENV="${{ matrix.environment }}"
          echo "TEST_ENV=$ENV" >> $GITHUB_ENV
          echo "RUN_GITOPS_TESTS=1" >> $GITHUB_ENV
          echo "KYVERNO_POLICY_DEPLOYED=1" >> $GITHUB_ENV
          echo "AI_AAS_CONFIG_PATH=${{ github.workspace }}/ai-aas-config" >> $GITHUB_ENV

          # Set API endpoints for inference verification (AC-03 of UC-MLC-011)
          if [ "$ENV" = "development" ]; then
            echo "AI_AAS_API_ROUTER_URL=https://api.dev.otherjamesbrown.com" >> $GITHUB_ENV
          fi

      - name: Run GitOps tests
        id: tests
        working-directory: ai-aas/tests/usecases
        run: |
          set +e
          START_TIME=$(date +%s)

          # Run only GitOps tests (UC-MLC-010, UC-MLC-011)
          go test -v ./... \
            -run=TestUC_MLC_01 \
            -timeout ${{ env.TEST_TIMEOUT }} \
            -json > results.json 2>&1

          EXIT_CODE=$?
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

          # Count pass/fail from JSON output
          PASSED=$(grep -c '"Action":"pass"' results.json || echo 0)
          FAILED=$(grep -c '"Action":"fail"' results.json || echo 0)
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

          exit $EXIT_CODE

      - name: Cleanup ai-aas-config repository
        if: always()
        working-directory: ai-aas-config
        run: |
          # Remove any test model files that may have been left behind
          find environments/development/models -name 'tinyllama-gitops-test-*.yaml' -delete || true

          # Commit and push cleanup if there are changes
          if ! git diff --quiet; then
            git add -A
            git commit -m "test cleanup: remove orphaned GitOps test models"
            git push origin develop || true
          fi

      - name: Generate JUnit XML report
        if: always()
        working-directory: ai-aas/tests/usecases
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          cat results.json | go-junit-report -parser gojson > results.xml

      - name: Generate metrics summary
        if: always()
        working-directory: ai-aas/tests/usecases
        run: |
          cat > metrics.json << EOF
          {
            "timestamp": "${{ steps.tests.outputs.timestamp }}",
            "date": "${{ steps.tests.outputs.date }}",
            "environment": "${{ matrix.environment }}",
            "test_type": "gitops",
            "duration_seconds": ${{ steps.tests.outputs.duration }},
            "tests_passed": ${{ steps.tests.outputs.passed }},
            "tests_failed": ${{ steps.tests.outputs.failed }},
            "exit_code": ${{ steps.tests.outputs.exit_code }},
            "run_id": "${{ github.run_id }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF
          cat metrics.json

      - name: Upload results to Object Storage
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LINODE_OBJECT_STORAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LINODE_OBJECT_STORAGE_SECRET_KEY }}
        run: |
          cd ai-aas/tests/usecases
          DATE="${{ steps.tests.outputs.date }}"
          ENV="${{ matrix.environment }}"
          PREFIX="${{ env.RESULTS_PREFIX }}"

          # Upload to dated folder (using Linode Object Storage endpoint)
          aws s3 cp results.json "s3://${{ env.RESULTS_BUCKET }}/${PREFIX}/nightly/${ENV}/${DATE}/results.json" \
            --endpoint-url ${{ env.S3_ENDPOINT }}
          aws s3 cp results.xml "s3://${{ env.RESULTS_BUCKET }}/${PREFIX}/nightly/${ENV}/${DATE}/results.xml" \
            --endpoint-url ${{ env.S3_ENDPOINT }}
          aws s3 cp metrics.json "s3://${{ env.RESULTS_BUCKET }}/${PREFIX}/nightly/${ENV}/${DATE}/metrics.json" \
            --endpoint-url ${{ env.S3_ENDPOINT }}

          # Also upload to latest for easy access
          aws s3 cp metrics.json "s3://${{ env.RESULTS_BUCKET }}/${PREFIX}/nightly/${ENV}/latest/metrics.json" \
            --endpoint-url ${{ env.S3_ENDPOINT }}

      - name: Upload GitHub artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitops-results-${{ matrix.environment }}-${{ steps.tests.outputs.date }}
          path: |
            ai-aas/tests/usecases/results.json
            ai-aas/tests/usecases/results.xml
            ai-aas/tests/usecases/metrics.json
          retention-days: 90

      - name: Update Grafana annotations
        if: always()
        continue-on-error: true
        run: |
          # Post annotation to Grafana for the test run
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.GRAFANA_URL }}/api/annotations" \
            -d '{
              "dashboardUID": "gitops-tests",
              "time": '$(($(date +%s) * 1000))',
              "tags": ["gitops", "nightly", "${{ matrix.environment }}"],
              "text": "GitOps Tests (${{ matrix.environment }}): ${{ steps.tests.outputs.passed }} passed, ${{ steps.tests.outputs.failed }} failed"
            }'

      - name: Check test results
        if: always()
        run: |
          if [ "${{ steps.tests.outputs.exit_code }}" != "0" ]; then
            echo "::error::GitOps tests failed for ${{ matrix.environment }} with ${{ steps.tests.outputs.failed }} failures"
            exit 1
          fi
          echo "::notice::GitOps tests passed for ${{ matrix.environment }}: ${{ steps.tests.outputs.passed }} tests"

  # Aggregate trends after all environments complete
  aggregate-trends:
    name: Aggregate Trends
    needs: gitops-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Aggregate last 30 days of metrics
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LINODE_OBJECT_STORAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LINODE_OBJECT_STORAGE_SECRET_KEY }}
        run: |
          ENV="development"
          PREFIX="${{ env.RESULTS_PREFIX }}"

          # Download last 30 days of metrics
          mkdir -p /tmp/metrics
          for i in $(seq 0 29); do
            DATE=$(date -u -d "$i days ago" +%Y-%m-%d)
            aws s3 cp "s3://${{ env.RESULTS_BUCKET }}/${PREFIX}/nightly/${ENV}/${DATE}/metrics.json" \
              "/tmp/metrics/${DATE}.json" --endpoint-url ${{ env.S3_ENDPOINT }} 2>/dev/null || true
          done

          # Combine into trends file
          echo "[" > /tmp/trends.json
          first=true
          for f in /tmp/metrics/*.json; do
            [ -f "$f" ] || continue
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> /tmp/trends.json
            fi
            cat "$f" >> /tmp/trends.json
          done
          echo "]" >> /tmp/trends.json

          # Upload aggregated trends
          aws s3 cp /tmp/trends.json "s3://${{ env.RESULTS_BUCKET }}/${PREFIX}/trends/${ENV}/last-30-days.json" \
            --endpoint-url ${{ env.S3_ENDPOINT }}

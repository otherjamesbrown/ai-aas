name: Analytics Service CI

on:
  push:
    paths:
      - 'services/analytics-service/**'
      - '.github/workflows/analytics-service.yml'
      - 'templates/service.mk'
      - 'configs/golangci.yml'
      - 'configs/gosec.toml'
  pull_request:
    paths:
      - 'services/analytics-service/**'
      - '.github/workflows/analytics-service.yml'
      - 'templates/service.mk'
      - 'configs/golangci.yml'
      - 'configs/gosec.toml'
  workflow_dispatch: {}

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache-dependency-path: services/analytics-service/go.sum

      - name: Install dependencies
        run: |
          go mod download
          go mod verify

      - name: Run gofmt
        run: make fmt

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.62.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run golangci-lint
        run: golangci-lint run --config ../../configs/golangci.yml
        working-directory: services/analytics-service

      - name: Run gosec security scan
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt json -out gosec-report.json ./...'
          working-directory: services/analytics-service

      - name: Run tests
        run: make test

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache-dependency-path: services/analytics-service/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start dependencies
        run: make dev-up

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until docker compose -f dev/docker-compose.yml exec -T redis redis-cli ping > /dev/null 2>&1; do sleep 2; done'
          timeout 60 bash -c 'until docker compose -f dev/docker-compose.yml exec -T postgres pg_isready -U analytics > /dev/null 2>&1; do sleep 2; done'
          timeout 90 bash -c 'until docker compose -f dev/docker-compose.yml exec -T rabbitmq rabbitmq-diagnostics ping > /dev/null 2>&1; do sleep 2; done'

      - name: Run integration tests
        run: make integration-test

      - name: Stop dependencies
        if: always()
        run: make dev-down

  build-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]  # Only require unit tests and linting to pass
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/analytics-service
          tags: |
            type=sha,prefix={{branch}}-
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .  # Use repo root to include shared module
          file: ./services/analytics-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx urllib3

      - name: Wait for ArgoCD sync
        run: |
          echo "Waiting 90 seconds for ArgoCD to sync and deploy new image..."
          sleep 90

      - name: Validate health endpoint
        run: |
          echo "Testing analytics service health endpoint..."
          curl -k -f -v https://analytics.172.232.58.222.nip.io/analytics/v1/status/healthz || exit 1

      - name: Validate readiness endpoint
        run: |
          echo "Testing analytics service readiness endpoint..."
          curl -k -f -v https://analytics.172.232.58.222.nip.io/analytics/v1/status/readyz || exit 1

      - name: Report validation results
        if: always()
        run: |
          echo "## Deployment Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "Service: Analytics Service" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Development" >> $GITHUB_STEP_SUMMARY
          echo "Base URL: https://analytics.172.232.58.222.nip.io" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

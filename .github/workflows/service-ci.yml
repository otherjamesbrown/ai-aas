name: CI

on:
  workflow_dispatch:  # Allow manual triggering
  push:
    branches:
      - main
      - develop
      - staging
    paths:
      - 'services/**'
      - 'shared/**'
      - 'db/migrations/**'
      - '.github/workflows/service-ci.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    paths:
      - 'services/**'
      - 'shared/**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/otherjamesbrown/ai-aas

jobs:
  admin-api-service:
    uses: ./.github/workflows/reusable-build.yml
    with:
      service: admin-api-service
      target: test
      go-version: "1.24.x"

  ai-aas-cli:
    uses: ./.github/workflows/reusable-build.yml
    with:
      service: ai-aas-cli
      target: test
      go-version: "1.24.x"

  analytics-service:
    uses: ./.github/workflows/reusable-build.yml
    with:
      service: analytics-service
      target: test
      go-version: "1.24.x"

  api-router-service:
    uses: ./.github/workflows/reusable-build.yml
    with:
      service: api-router-service
      target: test
      go-version: "1.24.x"

  hello-service:
    uses: ./.github/workflows/reusable-build.yml
    with:
      service: hello-service
      target: test
      go-version: "1.24.x"

  model-downloader:
    uses: ./.github/workflows/reusable-build.yml
    with:
      service: model-downloader
      target: test
      go-version: "1.24.x"

  user-org-service:
    uses: ./.github/workflows/reusable-build.yml
    with:
      service: user-org-service
      target: test
      go-version: "1.24.x"

  world-service:
    uses: ./.github/workflows/reusable-build.yml
    with:
      service: world-service
      target: test
      go-version: "1.24.x"

  lint:
    name: Lint
    needs:
      - admin-api-service
      - ai-aas-cli
      - analytics-service
      - api-router-service
      - hello-service
      - model-downloader
      - user-org-service
      - world-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Check Go Module Path Consistency
        run: ./scripts/ci/check-go-modules.sh
      - name: Run go vet on all services
        run: |
          for dir in services/*/; do
            # Skip template directory
            if [[ "$dir" == *"_template"* ]]; then
              continue
            fi
            if [ -f "$dir/go.mod" ]; then
              echo "Running go vet for $dir"
              (cd "$dir" && go vet ./...)
            fi
          done
          if [ -f "shared/go/go.mod" ]; then
            echo "Running go vet for shared/go"
            (cd shared/go && go vet ./...)
          fi

  metrics-upload:
    name: Metrics Upload
    needs:
      - lint
    runs-on: ubuntu-latest
    if: ${{ always() }}
    env:
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install tooling
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.19.0
      - name: Run make check with metrics (best effort)
        continue-on-error: true
        id: check
        run: make check METRICS=true
      - name: Upload metrics artifact (dry run)
        env:
          METRICS_BUCKET: ai-aas-build-metrics
        run: |
          if [ -d "scripts/metrics/output" ] && [ -n "$(ls -A scripts/metrics/output/*.json 2>/dev/null)" ]; then
            FILE=$(ls -t scripts/metrics/output/*.json | head -n 1)
            echo "Uploading $FILE"
            ./scripts/metrics/upload.sh --dry-run "$FILE"
          else
            echo "No metrics files found, skipping upload"
          fi
      - name: Archive metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics-json
          path: scripts/metrics/output/*.json
          if-no-files-found: warn

  # Build and push Docker images for deployable services
  build-images:
    name: Build and Push Images
    needs: [lint]
    if: github.event_name == 'push'  # Only build on push, not PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-api-service
          - analytics-service
          - api-router-service
          - model-downloader
          - user-org-service
          # Note: hello-service and world-service don't have Dockerfiles
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix={{branch}}-
            type=sha,format=short
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Determine platforms
        id: platforms
        run: |
          if [ "${{ matrix.service }}" == "model-downloader" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ steps.platforms.outputs.platforms }}

  # Update Helm values with new image tags (single consolidated commit)
  update-helm-values:
    name: Update Helm Values
    needs: [build-images]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update all service image tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="sha-${SHORT_SHA}"
          SERVICES=(admin-api-service analytics-service api-router-service model-downloader user-org-service)
          UPDATED=()

          for service in "${SERVICES[@]}"; do
            VALUES_FILE="services/${service}/deployments/helm/${service}/values-development.yaml"
            if [ -f "$VALUES_FILE" ]; then
              yq eval ".image.tag = \"${IMAGE_TAG}\"" -i "$VALUES_FILE"
              echo "Updated $VALUES_FILE with image tag: ${IMAGE_TAG}"
              UPDATED+=("$service")
            fi
          done

          echo "Updated services: ${UPDATED[*]}"

      - name: Commit and push updated image tags
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="sha-${SHORT_SHA}"

          # Check if there are any changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add services/*/deployments/helm/*/values-development.yaml
          git commit -m "ci(images): update all service image tags to ${IMAGE_TAG} [skip ci]"
          git push origin develop


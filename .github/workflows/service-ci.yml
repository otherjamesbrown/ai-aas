name: CI

on:
  push:
    branches:
      - main
      - develop
      - staging
    paths:
      - 'services/**'
      - 'shared/**'
  pull_request:
    paths:
      - 'services/**'
      - 'shared/**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/otherjamesbrown/ai-aas

jobs:
  admin-api-service:
    uses: ./.github/workflows/reusable/build.yml
    with:
      service: admin-api-service
      target: test
      go-version: "1.24.x"

  admin-cli:
    uses: ./.github/workflows/reusable/build.yml
    with:
      service: admin-cli
      target: test
      go-version: "1.24.x"

  ai-aas-cli:
    uses: ./.github/workflows/reusable/build.yml
    with:
      service: ai-aas-cli
      target: test
      go-version: "1.24.x"

  analytics-service:
    uses: ./.github/workflows/reusable/build.yml
    with:
      service: analytics-service
      target: test
      go-version: "1.24.x"

  api-router-service:
    uses: ./.github/workflows/reusable/build.yml
    with:
      service: api-router-service
      target: test
      go-version: "1.24.x"

  hello-service:
    uses: ./.github/workflows/reusable/build.yml
    with:
      service: hello-service
      target: test
      go-version: "1.24.x"

  user-org-service:
    uses: ./.github/workflows/reusable/build.yml
    with:
      service: user-org-service
      target: test
      go-version: "1.24.x"

  world-service:
    uses: ./.github/workflows/reusable/build.yml
    with:
      service: world-service
      target: test
      go-version: "1.24.x"

  lint:
    name: Lint
    needs:
      - admin-api-service
      - admin-cli
      - ai-aas-cli
      - analytics-service
      - api-router-service
      - hello-service
      - user-org-service
      - world-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | \
            sh -s -- -b "$(go env GOPATH)"/bin v1.61.0
      - name: Run golangci-lint
        run: make lint

  metrics-upload:
    name: Metrics Upload
    needs:
      - lint
    runs-on: ubuntu-latest
    if: ${{ always() }}
    env:
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install tooling
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | \
            sh -s -- -b "$(go env GOPATH)"/bin v1.55.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.19.0
      - name: Run make check with metrics
        continue-on-error: true
        id: check
        run: make check METRICS=true
      - name: Upload metrics artifact (dry run)
        env:
          METRICS_BUCKET: ai-aas-build-metrics
        run: |
          if [ -d "scripts/metrics/output" ] && [ -n "$(ls -A scripts/metrics/output/*.json 2>/dev/null)" ]; then
            FILE=$(ls -t scripts/metrics/output/*.json | head -n 1)
            echo "Uploading $FILE"
            ./scripts/metrics/upload.sh --dry-run "$FILE"
          else
            echo "No metrics files found, skipping upload"
          fi
      - name: Archive metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics-json
          path: scripts/metrics/output/*.json
          if-no-files-found: warn

  # Build and push Docker images for deployable services
  build-images:
    name: Build and Push Images
    needs: [lint]
    if: github.event_name == 'push'  # Only build on push, not PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-api-service
          - analytics-service
          - api-router-service
          - hello-service
          - user-org-service
          - world-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix={{branch}}-
            type=sha,format=short
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

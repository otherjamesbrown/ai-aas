name: E2E Tests

on:
  push:
    branches:
      - main
    paths:
      - 'tests/e2e/**'
      - 'services/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'services/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      parallelism:
        description: 'Number of parallel workers'
        required: true
        default: 4

env:
  GO_VERSION: '1.24.x'
  TEST_TIMEOUT: '30m'

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        worker: ${{ fromJson(format('[{0}]', join(range(1, inputs.parallelism || 4), ','))) }}
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          cd tests/e2e
          go mod download
          go mod verify

      - name: Configure test environment
        run: |
          echo "TEST_ENV=ci" >> $GITHUB_ENV
          echo "USER_ORG_SERVICE_URL=${{ secrets.USER_ORG_SERVICE_URL || 'https://user-org.api.ai-aas.dev' }}" >> $GITHUB_ENV
          echo "API_ROUTER_SERVICE_URL=${{ secrets.API_ROUTER_SERVICE_URL || 'https://router.api.ai-aas.dev' }}" >> $GITHUB_ENV
          echo "ANALYTICS_SERVICE_URL=${{ secrets.ANALYTICS_SERVICE_URL || 'https://analytics.api.ai-aas.dev' }}" >> $GITHUB_ENV
          echo "ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}" >> $GITHUB_ENV
          echo "REQUEST_TIMEOUT_MS=30000" >> $GITHUB_ENV
          echo "PARALLEL_WORKERS=${{ matrix.worker }}" >> $GITHUB_ENV
          echo "WORKER_ID=${{ matrix.worker }}" >> $GITHUB_ENV

      - name: Run E2E tests
        working-directory: tests/e2e
        run: |
          go test -v ./suites/... \
            -timeout ${{ env.TEST_TIMEOUT }} \
            -parallel ${{ matrix.worker }} \
            -json > test-results-worker-${{ matrix.worker }}.json || true

      - name: Generate JUnit XML report
        if: always()
        working-directory: tests/e2e
        run: |
          go install github.com/jstemmer/go-junit-report@latest
          cat test-results-worker-${{ matrix.worker }}.json | go-junit-report > test-results-worker-${{ matrix.worker }}.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports-worker-${{ matrix.worker }}
          path: tests/e2e/test-results-worker-${{ matrix.worker }}.xml
          retention-days: 30

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-worker-${{ matrix.worker }}
          path: tests/e2e/test-results-worker-${{ matrix.worker }}.json
          retention-days: 30


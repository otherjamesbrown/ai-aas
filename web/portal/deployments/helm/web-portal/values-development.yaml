# Development environment overrides
# Domain configuration is computed from global.domain.base
# See values.yaml for defaults and configs/environments/development.yaml for canonical source

replicaCount: 2

image:
  tag: dev
  pullPolicy: Always

# Ingress configuration - hosts computed from global.domain.base
ingress:
  enabled: true
  # subdomain: portal (default from values.yaml)
  # Hosts are computed automatically:
  #   - portal.dev.ai-aas.local (local domain)
  #   - portal.dev.otherjamesbrown.com (public domain)

# VITE_ environment variables are computed from global.domain in the deployment template
# See templates/deployment.yaml for computed values:
#   - VITE_API_BASE_URL: https://api.dev.otherjamesbrown.com
#   - VITE_OAUTH_ISSUER_URL: https://api.dev.otherjamesbrown.com
#   - VITE_OAUTH_REDIRECT_URI: https://portal.dev.otherjamesbrown.com/auth/callback

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5


# Web Portal - Helm Chart Values
# =====================================
#
# Domain Configuration:
# --------------------
# This chart uses centralized domain configuration. Override `global.domain.base`
# in environment-specific values files (values-development.yaml, values-production.yaml).
#
# All ingress hostnames are derived from global.domain.base:
#   - portal.{global.domain.base} -> portal.dev.otherjamesbrown.com
#
# See configs/environments/*.yaml for environment-specific domain settings.
#
# For AI Coding Assistants:
# ------------------------
# 1. NEVER hardcode domain names - use global.domain.base
# 2. ALWAYS use HTTPS (force-ssl-redirect: "true")
# 3. Use cert-manager with Let's Encrypt for TLS certificates
# 4. All deployments MUST go through ArgoCD
#

# Global configuration - shared across all services
# Override in values-{environment}.yaml
global:
  domain:
    # Base domain for this environment (override per environment)
    base: "dev.otherjamesbrown.com"
    # Local hostname for /etc/hosts access (optional)
    local: "dev.ai-aas.local"
    # Protocol for URLs
    protocol: "https"
  tls:
    # Enable TLS with cert-manager
    enabled: true
    # ClusterIssuer to use for certificates
    clusterIssuer: "letsencrypt-prod"
  # Service subdomains - used to construct full hostnames
  services:
    portal: "portal"
    api: "api"

replicaCount: 2

image:
  repository: ghcr.io/otherjamesbrown/web-portal
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # cert-manager annotation will be added by template when tls.enabled
  # Service subdomain - combined with global.domain.base
  subdomain: portal
  # hosts is now computed from global.domain.base in the template
  # Override with explicit hosts array only if needed
  hosts: []
  # TLS secret name - will be auto-generated if empty
  tlsSecretName: ""

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Environment variables for the web portal
# Note: These VITE_ variables are computed in the deployment template from global.domain.base
# See templates/deployment.yaml for computed values
env: []

# Static environment variables (non-domain related)
staticEnv:
  - name: VITE_OAUTH_CLIENT_ID
    value: ""
  - name: VITE_OTEL_EXPORTER_OTLP_ENDPOINT
    value: ""
  - name: VITE_OTEL_SERVICE_NAME
    value: "web-portal"
  - name: VITE_OTEL_SERVICE_VERSION
    value: "0.1.0"

# Secrets for sensitive configuration
envSecrets: []

# Nginx configuration
nginx:
  config: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # Gzip compression
      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

      # Security headers
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;

      # SPA routing - serve index.html for all routes
      location / {
        try_files $uri $uri/ /index.html;
      }

      # Cache static assets
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # Health check endpoint
      location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
      }
    }


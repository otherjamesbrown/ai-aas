# Grafana Ingress Configuration
# NOTE: This is a template/example. The actual deployed ingress is at:
# infra/k8s/monitoring/grafana/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.dev.otherjamesbrown.com
        - grafana.prod.otherjamesbrown.com
  rules:
    - host: grafana.dev.otherjamesbrown.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
    - host: grafana.prod.otherjamesbrown.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000


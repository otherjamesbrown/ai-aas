# kube-prometheus-stack Helm Chart Values for Staging
# =====================================================
# This values file configures the kube-prometheus-stack for the staging environment.
# It deploys Prometheus, Grafana, Alertmanager, and related components.

# Prometheus Operator Configuration
prometheusOperator:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Prometheus Server Configuration
prometheus:
  enabled: true
  prometheusSpec:
    # Resource allocation for staging
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi

    # Retention period
    retention: 15d

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # ServiceMonitor selector - discover ALL ServiceMonitors (no label filtering)
    serviceMonitorSelectorNilUsesHelmValues: false

    # PodMonitor selector - discover ALL PodMonitors
    podMonitorSelectorNilUsesHelmValues: false

    # PrometheusRule selector - discover ALL PrometheusRules
    ruleSelectorNilUsesHelmValues: false

    # Scrape interval
    scrapeInterval: 15s

    # Enable service discovery
    additionalScrapeConfigs: []

# Grafana Configuration
grafana:
  enabled: true
  adminPassword: admin123  # Change in production

  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Persistence
  persistence:
    enabled: true
    size: 10Gi

  # Datasources - automatically configure Prometheus, Loki, Tempo
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://kube-prometheus-stack-prometheus:9090
          access: proxy
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki-gateway.observability.svc.cluster.local
          access: proxy
        - name: Tempo
          type: tempo
          url: http://tempo.observability.svc.cluster.local:3100
          access: proxy

  # Dashboard sidecar - automatically load dashboards from ConfigMaps
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folder: /tmp/dashboards
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true

  # Ingress configuration
  ingress:
    enabled: false  # Managed separately via monitoring-ingresses app
    ingressClassName: nginx

# Alertmanager Configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# Node Exporter (metrics from all nodes)
nodeExporter:
  enabled: true

# Kube State Metrics (cluster metrics)
kubeStateMetrics:
  enabled: true

# Default Prometheus Rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubeProxy: false
    kubelet: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    node: true
    prometheus: true

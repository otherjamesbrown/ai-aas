---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inference-models
  namespace: staging
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - staging
  selector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  endpoints:
    # vLLM models expose metrics on port http1 (8000)
    - port: http1
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
    # TensorRT-LLM and Triton models expose metrics on port metrics (8002)
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

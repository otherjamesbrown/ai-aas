# Alertmanager Secrets Template
# =============================
# DO NOT COMMIT THIS FILE WITH REAL VALUES
# This is a template showing the structure of the secret needed for Alertmanager

# IMPORTANT: This secret must be created BEFORE deploying/syncing kube-prometheus-stack
# with the custom Alertmanager configuration.

# Create this secret using kubectl:
#
# kubectl create secret generic alertmanager-secrets \
#   --from-literal=slack-webhook-url='https://hooks.slack.com/services/YOUR/WEBHOOK/URL' \
#   --from-literal=pagerduty-service-key='YOUR_PAGERDUTY_INTEGRATION_KEY' \
#   -n monitoring \
#   --kubeconfig=secrets/kubeconfigs/kubeconfig-staging.yaml

# For development:
# kubectl create secret generic alertmanager-secrets \
#   --from-literal=slack-webhook-url='https://hooks.slack.com/services/YOUR/WEBHOOK/URL' \
#   --from-literal=pagerduty-service-key='YOUR_PAGERDUTY_INTEGRATION_KEY' \
#   -n monitoring \
#   --kubeconfig=secrets/kubeconfigs/kubeconfig-development.yaml

---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
  labels:
    app: alertmanager
    component: observability
type: Opaque
stringData:
  # Slack incoming webhook URL
  # Get from: Slack → Apps → Custom Integrations → Incoming Webhooks
  # Format: https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXX
  slack-webhook-url: ""

  # PagerDuty integration key
  # Get from: PagerDuty → Services → Your Service → Integrations → Events API v2
  # Format: 32-character alphanumeric string
  pagerduty-service-key: ""

# Verification:
# kubectl get secret alertmanager-secrets -n monitoring
# kubectl describe secret alertmanager-secrets -n monitoring

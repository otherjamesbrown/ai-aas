# Tempo Service
# ClusterIP service for internal access
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: monitoring
  labels:
    app: tempo
spec:
  type: ClusterIP
  ports:
    - port: 3200
      targetPort: 3200
      protocol: TCP
      name: http
    - port: 9096
      targetPort: 9096
      protocol: TCP
      name: grpc
    - port: 4317
      targetPort: 4317
      protocol: TCP
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      protocol: TCP
      name: otlp-http
  selector:
    app: tempo
---
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: tempo-headless
  namespace: monitoring
  labels:
    app: tempo
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 3200
      targetPort: 3200
      protocol: TCP
      name: http
  selector:
    app: tempo

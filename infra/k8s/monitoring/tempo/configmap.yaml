# Tempo Configuration
# Distributed tracing backend for trace storage
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: monitoring
  labels:
    app: tempo
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 9096
      log_level: info

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 336h  # 14 days retention (matches Loki)

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: ai-aas-dev
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
            send_exemplars: true
      traces_storage:
        path: /var/tempo/generator/traces
      processor:
        service_graphs:
          dimensions: []
          histogram_buckets: [0.1, 0.2, 0.4, 0.8, 1.0, 2.0, 4.0, 8.0]
        span_metrics:
          dimensions: []
          histogram_buckets: [0.1, 0.2, 0.4, 0.8, 1.0, 2.0, 4.0, 8.0]

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks

    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]

# Loki Ingress
# Exposes Loki API via HTTPS
#
# Access URLs:
# - Hostname: https://loki.dev.ai-aas.local (requires /etc/hosts entry)
# - Public DNS: https://loki.dev.otherjamesbrown.com
#
# Example queries:
# curl -s 'https://loki.dev.otherjamesbrown.com/loki/api/v1/query_range' \
#   --data-urlencode 'query={level="error"}' \
#   --data-urlencode 'limit=50'
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki-ingress
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: loki.dev.ai-aas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100
    - host: loki.dev.otherjamesbrown.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100
  tls:
    - secretName: loki-tls
      hosts:
        - loki.dev.otherjamesbrown.com

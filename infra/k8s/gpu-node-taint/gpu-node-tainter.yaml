apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-node-tainter
  namespace: gpu-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-node-tainter
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-node-tainter
subjects:
  - kind: ServiceAccount
    name: gpu-node-tainter
    namespace: gpu-operator
roleRef:
  kind: ClusterRole
  name: gpu-node-tainter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-node-tainter
  namespace: gpu-operator
  labels:
    app: gpu-node-tainter
spec:
  selector:
    matchLabels:
      app: gpu-node-tainter
  template:
    metadata:
      labels:
        app: gpu-node-tainter
    spec:
      serviceAccountName: gpu-node-tainter
      # Only run on nodes with GPUs (detected by node-feature-discovery)
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"  # NVIDIA GPU present
      # Tolerate all taints so we can run and apply taints
      tolerations:
        - operator: Exists
      containers:
        - name: tainter
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "GPU Node Tainter starting on node: $NODE_NAME"

              # Apply the GPU taint if not already present
              while true; do
                # Check if taint already exists
                EXISTING_TAINT=$(kubectl get node $NODE_NAME -o jsonpath='{.spec.taints[?(@.key=="nvidia.com/gpu")].effect}' 2>/dev/null || echo "")

                if [ "$EXISTING_TAINT" != "NoSchedule" ]; then
                  echo "Applying nvidia.com/gpu=true:NoSchedule taint to $NODE_NAME"
                  kubectl taint nodes $NODE_NAME nvidia.com/gpu=true:NoSchedule --overwrite
                  echo "Taint applied successfully"
                else
                  echo "Taint already present on $NODE_NAME"
                fi

                # Sleep and check again (in case taint gets removed)
                sleep 300
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

# AIModel CR for Mistral-7B-Instruct-v0.3 (Development)
#
# SECURITY WARNING: This configuration uses trustRemoteCode
# which allows the model to execute arbitrary Python code from HuggingFace.
# Only use with trusted model sources.
apiVersion: aimodel.ai-aas.io/v1alpha1
kind: AIModel
metadata:
  name: mistral-7b-instruct-v03
  namespace: development
  labels:
    app: vllm-inference
    model: mistral-7b-instruct
    version: v0.3
    environment: development
spec:
  modelName: mistral-7b-instruct-v03
  modelID: mistralai/Mistral-7B-Instruct-v0.3
  enabled: true
  runtime: vllm
  minReplicas: 1
  maxReplicas: 1
  resources:
    requests:
      cpu: "4"
      memory: "16Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "8"
      memory: "32Gi"
      nvidia.com/gpu: "1"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  runtimeArgs:
    - --dtype=auto
    - --max-model-len=8192
    - --gpu-memory-utilization=0.9
  trustRemoteCode: true

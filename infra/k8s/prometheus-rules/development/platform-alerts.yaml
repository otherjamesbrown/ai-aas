# Platform-wide Prometheus Alerting Rules
# ========================================
# These rules provide alerting for all platform services

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
  labels:
    app: prometheus
    release: prometheus
spec:
  groups:
    # API Router Service Alerts
    - name: api-router-service
      rules:
        - alert: APIRouterHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{job="api-router-service", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="api-router-service"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            service: api-router-service
          annotations:
            summary: "High error rate on API Router"
            description: "API Router error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

        - alert: APIRouterHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{job="api-router-service"}[5m])) by (le)
            ) > 2
          for: 5m
          labels:
            severity: warning
            service: api-router-service
          annotations:
            summary: "High latency on API Router"
            description: "API Router p95 latency is {{ $value | humanizeDuration }} (threshold: 2s)"

        - alert: APIRouterPodNotReady
          expr: |
            kube_deployment_status_replicas_ready{deployment=~".*api-router.*", namespace="development"}
            /
            kube_deployment_status_replicas{deployment=~".*api-router.*", namespace="development"}
            < 0.5
          for: 5m
          labels:
            severity: critical
            service: api-router-service
          annotations:
            summary: "API Router has insufficient ready replicas"
            description: "Less than 50% of API Router pods are ready"

    # Admin API Service Alerts
    - name: admin-api-service
      rules:
        - alert: AdminAPIHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{job="admin-api-service", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="admin-api-service"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            service: admin-api-service
          annotations:
            summary: "High error rate on Admin API"
            description: "Admin API error rate is {{ $value | humanizePercentage }}"

        - alert: AdminAPIDatabaseConnectionFailure
          expr: |
            admin_api_database_connection_errors_total > 0
          for: 2m
          labels:
            severity: critical
            service: admin-api-service
          annotations:
            summary: "Admin API database connection failures"
            description: "Admin API is experiencing database connection errors"

    # User-Org Service Alerts
    - name: user-org-service
      rules:
        - alert: UserOrgServiceHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{job="user-org-service", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="user-org-service"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            service: user-org-service
          annotations:
            summary: "High error rate on User-Org Service"
            description: "User-Org Service error rate is {{ $value | humanizePercentage }}"

    # Infrastructure Alerts
    - name: infrastructure
      rules:
        - alert: EtcdUnhealthy
          expr: |
            up{job="etcd"} == 0
          for: 2m
          labels:
            severity: critical
            service: etcd
          annotations:
            summary: "etcd is down"
            description: "etcd service is not responding to health checks"

        - alert: RedisUnhealthy
          expr: |
            up{job="redis"} == 0
          for: 2m
          labels:
            severity: critical
            service: redis
          annotations:
            summary: "Redis is down"
            description: "Redis service is not responding to health checks"

        - alert: HighMemoryUsage
          expr: |
            (
              container_memory_usage_bytes{namespace="development"}
              /
              container_spec_memory_limit_bytes{namespace="development"}
            ) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage detected"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of memory limit"

        - alert: HighCPUUsage
          expr: |
            (
              rate(container_cpu_usage_seconds_total{namespace="development"}[5m])
              /
              container_spec_cpu_quota{namespace="development"} * 100000
            ) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage detected"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of CPU limit"

    # vLLM/Inference Alerts
    - name: inference
      rules:
        - alert: VLLMHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(vllm_request_duration_seconds_bucket[5m])) by (le)
            ) > 30
          for: 5m
          labels:
            severity: warning
            service: vllm
          annotations:
            summary: "High inference latency"
            description: "vLLM p95 latency is {{ $value | humanizeDuration }} (threshold: 30s)"

        - alert: VLLMGPUMemoryHigh
          expr: |
            (vllm_gpu_memory_used_bytes / vllm_gpu_memory_total_bytes) > 0.95
          for: 5m
          labels:
            severity: warning
            service: vllm
          annotations:
            summary: "vLLM GPU memory usage high"
            description: "GPU memory usage is {{ $value | humanizePercentage }}"

        - alert: InferenceServicePodRestarts
          expr: |
            increase(kube_pod_container_status_restarts_total{
              pod=~".*predictor.*"
            }[1h]) > 1
          for: 5m
          labels:
            severity: warning
            service: kserve
            category: inference
          annotations:
            summary: "InferenceService pod {{ $labels.pod }} is restarting frequently"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times in the last hour. This may indicate liveness probe failures, OOM kills, or application crashes. Check pod logs and describe the pod for details."

    # Guidellm Runner Alerts
    - name: guidellm-runner
      rules:
        - alert: GuidellmRunnerStuckNoBenchmarks
          expr: |
            (
              guidellm_runner_up == 1
              and
              (
                (increase(guidellm_requests_total[1h]) == 0)
                or
                (absent(guidellm_requests_total) == 1)
              )
            )
          for: 1h
          labels:
            severity: warning
            service: guidellm-runner
            category: monitoring
          annotations:
            summary: "Guidellm runner is active but not sending requests"
            description: "Guidellm runner has been up for over 1 hour but guidellm_requests_total has not increased. This may indicate a validation failure, configuration issue, or stuck benchmark. Check runner logs for validation errors or benchmark failures."

    # AI Model Deployment Alerts
    - name: aimodel-deployment
      rules:
        # Stuck in any in-progress phase (includes granular phases: Validating, Scheduling, Downloading, Initializing, Deploying)
        - alert: AIModelDeploymentStuck
          expr: |
            (sum by (name, namespace) (aimodel_status_phase{phase=~"Validating|Scheduling|Downloading|Initializing|Deploying"}) == 1)
            * on(name, namespace) group_left()
            (time() - aimodel_phase_start_time_seconds > 1800)
          for: 5m
          labels:
            severity: warning
            service: ai-model-operator
            category: deployment
          annotations:
            summary: "Model {{ $labels.name }} stuck in deployment for >30min"
            description: "Model {{ $labels.name }} in {{ $labels.namespace }} has been deploying for over 30 minutes. Check scheduling status, download progress, and operator logs. This may indicate resource constraints, image pull issues, model download failures, or operator problems."
            runbook_url: "https://docs.ai-aas.io/runbooks/stuck-deployment"

        # Scheduling blocked
        - alert: AIModelSchedulingBlocked
          expr: |
            aimodel_blocked{reason=~"Insufficient.*|MaxSize.*"} == 1
          for: 10m
          labels:
            severity: warning
            service: ai-model-operator
            category: deployment
          annotations:
            summary: "Model {{ $labels.name }} cannot schedule: {{ $labels.reason }}"
            description: "Model {{ $labels.name }} has been unable to schedule for 10+ minutes due to {{ $labels.reason }}. Check node capacity, GPU availability, and resource requests."

        # Deployment failed
        - alert: AIModelDeploymentFailed
          expr: aimodel_status_phase{phase="Failed"} == 1
          for: 1m
          labels:
            severity: critical
            service: ai-model-operator
            category: deployment
          annotations:
            summary: "Model {{ $labels.name }} deployment failed"
            description: "Model {{ $labels.name }} in {{ $labels.namespace }} has failed to deploy. Check operator logs and model resource status for error details."

        # Pod crash loop
        - alert: AIModelPodCrashLoop
          expr: |
            rate(kube_pod_container_status_restarts_total{container="kserve-container"}[15m]) > 0
            * on(pod) group_left(label_serving_kserve_io_inferenceservice)
            kube_pod_labels{label_serving_kserve_io_inferenceservice!=""}
          for: 5m
          labels:
            severity: critical
            service: kserve
            category: deployment
          annotations:
            summary: "Model pod {{ $labels.pod }} is crash looping"
            description: "Model pod {{ $labels.pod }} for inference service {{ $labels.label_serving_kserve_io_inferenceservice }} is experiencing repeated crashes. Check pod logs for errors (OOM, panic, configuration issues)."

        # GPU node pool exhausted
        - alert: GPUNodePoolExhausted
          expr: |
            sum(kube_node_status_allocatable{resource="nvidia_com_gpu"})
            - sum(kube_pod_container_resource_requests{resource="nvidia_com_gpu"}) == 0
          for: 5m
          labels:
            severity: warning
            service: kubernetes
            category: capacity
          annotations:
            summary: "All GPU resources allocated"
            description: "No GPU capacity available. New model deployments will be blocked until resources are freed or the node pool is scaled. Consider scaling up GPU nodes or terminating unused models."

        # Routing policy drift detected
        - alert: AIModelRoutingPolicyDrift
          expr: aimodel_routing_policy_drift_detected == 1
          for: 5m
          labels:
            severity: warning
            service: ai-model-operator
            category: drift-detection
          annotations:
            summary: "Routing policy drift detected for model {{ $labels.name }}"
            description: "Model {{ $labels.name }} in {{ $labels.namespace }} has routing policy drift detected. The desired routing policy (weight distribution) does not match the actual InferenceService routing. Auto-healing is enabled and will attempt to reconcile. Check operator logs if drift persists."
            runbook_url: "https://docs.ai-aas.io/runbooks/routing-policy-drift"

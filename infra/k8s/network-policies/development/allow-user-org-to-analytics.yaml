# Allow User-Org Service to Analytics Service
# ============================================
# Allows the user-org-service (in its own namespace) to access analytics-service
# in the development namespace for usage statistics queries.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-user-org-service-to-analytics
  namespace: development
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: analytics-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: user-org-service

# ArgoCD Application for Development Ingress Resources
# Manages ingress configurations and TLS secrets for development environment
#
# This application watches infra/k8s/development/ingress/ and automatically
# syncs any changes to ingress resources including:
# - user-org-service-ingress.yaml
# - etcd-ingress.yaml
# - ai-aas-tls-secret.yaml
#
# Apply with: kubectl apply -f infra/k8s/development/argocd-apps/ingress-development.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-development
  namespace: argocd
spec:
  destination:
    # Resources will be created in their respective namespaces as defined in each manifest
    server: https://kubernetes.default.svc
  project: platform-development
  source:
    path: infra/k8s/development/ingress
    repoURL: https://github.com/otherjamesbrown/ai-aas
    targetRevision: develop
    directory:
      recurse: true
  syncPolicy:
    automated:
      prune: true      # Remove resources that are no longer in git
      selfHeal: true   # Automatically sync when cluster state drifts from git
    syncOptions:
      - CreateNamespace=false  # Don't create namespaces (they should already exist)

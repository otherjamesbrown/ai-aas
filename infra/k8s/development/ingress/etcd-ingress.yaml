# etcd Service Ingress
# Exposes etcd (config-service) via HTTPS for admin-cli access
#
# Access URLs:
# - Hostname: https://etcd.dev.ai-aas.local (requires /etc/hosts entry)
# - IP-based: https://etcd.172.232.58.222.nip.io (works without DNS)
#
# Apply with: kubectl apply -f infra/k8s/development/ingress/etcd-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: etcd-ingress
  namespace: development
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
  - host: etcd.dev.ai-aas.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: etcd-service
            port:
              number: 2379
  - host: etcd.172.232.58.222.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: etcd-service
            port:
              number: 2379
  tls:
  - secretName: ai-aas-tls
    hosts:
    - etcd.dev.ai-aas.local
    - etcd.172.232.58.222.nip.io

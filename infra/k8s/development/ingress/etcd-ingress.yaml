# etcd Service Ingress
# Exposes etcd (config-service) via HTTPS for admin-cli access
#
# Access URLs:
# - Hostname: https://etcd.dev.ai-aas.local (requires /etc/hosts entry)
# - Public DNS: https://etcd.dev.otherjamesbrown.com
#
# Apply with: kubectl apply -f infra/k8s/development/ingress/etcd-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: etcd-ingress
  namespace: development
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
  - host: etcd.dev.ai-aas.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: etcd-service
            port:
              number: 2379
  - host: etcd.dev.otherjamesbrown.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: etcd-service
            port:
              number: 2379
  tls:
  - secretName: etcd-tls
    hosts:
    - etcd.dev.otherjamesbrown.com

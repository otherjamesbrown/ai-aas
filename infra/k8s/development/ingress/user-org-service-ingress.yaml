# User-Org Service Ingress
# Exposes the user-org-service via HTTPS with both hostname and public DNS access
#
# Access URLs:
# - Hostname: https://user-org.dev.ai-aas.local (requires /etc/hosts entry)
# - Public DNS: https://user-org.dev.otherjamesbrown.com
#
# Apply with: kubectl apply -f infra/k8s/development/ingress/user-org-service-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-org-service-ingress
  namespace: user-org-service
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
  - host: user-org.dev.ai-aas.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: user-org-service-development-user-org-service
            port:
              number: 8081
  - host: user-org.dev.otherjamesbrown.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: user-org-service-development-user-org-service
            port:
              number: 8081
  tls:
  - secretName: user-org-tls
    hosts:
    - user-org.dev.ai-aas.local
    - user-org.dev.otherjamesbrown.com

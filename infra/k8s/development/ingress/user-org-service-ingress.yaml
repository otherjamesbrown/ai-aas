# User-Org Service Ingress
# Exposes the user-org-service via HTTPS
#
# Domain Configuration:
# ---------------------
# When creating for a new environment, reference configs/environments/{env}.yaml
# and replace "dev.otherjamesbrown.com" with the environment's baseDomain.
#
# Access URL (Development): https://user-org.dev.otherjamesbrown.com
#
# Apply with: kubectl apply -f infra/k8s/development/ingress/user-org-service-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-org-service-ingress
  namespace: user-org-service
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
  - host: user-org.dev.otherjamesbrown.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: user-org-service-development-user-org-service
            port:
              number: 8081
  tls:
  - secretName: user-org-tls
    hosts:
    - user-org.dev.otherjamesbrown.com

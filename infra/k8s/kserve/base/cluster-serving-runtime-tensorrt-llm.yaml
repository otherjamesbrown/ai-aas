# ClusterServingRuntime for TensorRT-LLM with Triton Inference Server
# Defines how to run TensorRT-LLM optimized models in KServe
# Uses Triton server's v2 protocol for inference
#
# VERSION COMPATIBILITY:
# - Triton 24.08 includes TensorRT-LLM 0.12.x
# - Engine files must be built with matching TRT-LLM version
# - See: https://github.com/triton-inference-server/tensorrtllm_backend
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: kserve-tensorrt-llm
  annotations:
    ai.ai-aas.io/trtllm-version: "0.12.0"
    ai.ai-aas.io/triton-version: "24.08"
spec:
  annotations:
    prometheus.kserve.io/port: "8002"
    prometheus.kserve.io/path: /metrics
  supportedModelFormats:
    - name: tensorrt-llm
      version: "1"
      autoSelect: true
  protocolVersions: [v2, grpc-v2]
  containers:
    - name: kserve-container
      image: nvcr.io/nvidia/tritonserver:24.08-trtllm-python-py3
      args:
        - tritonserver
        - --model-store=/mnt/models
        - --http-port=8080
        - --grpc-port=9000
        - --allow-http=true
        - --allow-grpc=true
      ports:
        - containerPort: 8080
          name: http
        - containerPort: 9000
          name: grpc
        - containerPort: 8002
          name: metrics
      resources:
        requests:
          cpu: "4"
          memory: "24Gi"
        limits:
          cpu: "8"
          memory: "48Gi"
      livenessProbe:
        httpGet:
          path: /v2/health/live
          port: 8080
        initialDelaySeconds: 600
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /v2/health/ready
          port: 8080
        initialDelaySeconds: 600
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 3

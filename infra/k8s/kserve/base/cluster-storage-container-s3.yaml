# ClusterStorageContainer for S3-compatible storage (Linode Object Storage)
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterStorageContainer
metadata:
  name: s3-storage
spec:
  container:
    name: storage-initializer
    image: kserve/storage-initializer:v0.11.0
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: s3-credentials
            key: AWS_ACCESS_KEY_ID
            optional: true
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: s3-credentials
            key: AWS_SECRET_ACCESS_KEY
            optional: true
      - name: AWS_REGION
        value: fr-par-1
      - name: S3_ENDPOINT
        value: "https://fr-par-1.linodeobjects.com"
      - name: AWS_ENDPOINT_URL_S3
        value: "https://fr-par-1.linodeobjects.com"
      - name: AWS_ENDPOINT_URL
        value: "https://fr-par-1.linodeobjects.com"
      - name: S3_USE_HTTPS
        value: "1"
      - name: S3_VERIFY_SSL
        value: "0"

  supportedUriFormats:
    - regex: "s3://.*"

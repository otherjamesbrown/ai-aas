# Template for Hugging Face secret
# Create this secret in each namespace where InferenceServices will be deployed
---
apiVersion: v1
kind: Secret
metadata:
  name: huggingface-secret
  namespace: development  # Replace with target namespace
type: Opaque
stringData:
  token: "REPLACE_WITH_HF_TOKEN"  # Replace with actual Hugging Face token

---
# Template for S3 credentials secret
# Create this secret in each namespace where InferenceServices will use S3 storage
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: development  # Replace with target namespace
type: Opaque
stringData:
  access_key: "REPLACE_WITH_AWS_ACCESS_KEY"
  secret_key: "REPLACE_WITH_AWS_SECRET_KEY"

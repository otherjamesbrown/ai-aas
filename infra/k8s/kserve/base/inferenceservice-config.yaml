apiVersion: v1
kind: ConfigMap
metadata:
  name: inferenceservice-config
  namespace: kserve
data:
  # Deploy mode: Serverless (Knative) or RawDeployment (Kubernetes Deployment)
  deploy: |-
    {
      "defaultDeploymentMode": "Serverless"
    }

  # Predictors configuration
  predictors: |-
    {
      "pytorch": {
        "image": "pytorch/torchserve",
        "defaultImageVersion": "0.7.1",
        "defaultGpuImageVersion": "0.7.1-gpu",
        "supportedFrameworks": ["pytorch"],
        "multiModelServer": false
      },
      "vllm": {
        "image": "vllm/vllm-openai",
        "defaultImageVersion": "v0.3.0",
        "defaultGpuImageVersion": "v0.3.0",
        "supportedFrameworks": ["vllm"],
        "multiModelServer": false
      }
    }

  # Ingress configuration
  ingress: |-
    {
      "ingressGateway": "knative-serving/knative-ingress-gateway",
      "ingressService": "istio-ingressgateway.istio-system.svc.cluster.local",
      "localGateway": "knative-serving/knative-local-gateway",
      "localGatewayService": "knative-local-gateway.istio-system.svc.cluster.local"
    }

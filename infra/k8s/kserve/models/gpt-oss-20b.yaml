# KServe InferenceService for GPT-OSS-20B
# Optimized for NVIDIA RTX 4000 Ada (20GB VRAM)
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: gpt-oss-20b
  namespace: development
  labels:
    app: vllm-inference
    model: gpt-oss-20b
    version: v1.0
    environment: development
  annotations:
    serving.kserve.io/deploymentMode: "Serverless"
    # Knative autoscaling configuration - optimized for GPU inference
    autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"  # Use Knative Pod Autoscaler
    autoscaling.knative.dev/metric: "concurrency"  # Scale based on concurrent requests
    autoscaling.knative.dev/target: "1"  # Target 1 concurrent request per pod (aggressive)
    autoscaling.knative.dev/scaleDownDelay: "2m"  # Wait 2 minutes before scaling down
    autoscaling.knative.dev/window: "30s"  # 30s window for faster autoscaling decisions
    autoscaling.knative.dev/panicThreshold: "150"  # Panic at 150% of target (1.5 concurrent)
    autoscaling.knative.dev/panicWindowPercentage: "10"  # React quickly (10% of window = 3s)
    autoscaling.knative.dev/targetUtilizationPercentage: "70"  # Target 70% utilization
spec:
  predictor:
    # Keep 1 replica warm for testing
    minReplicas: 1
    maxReplicas: 2  # Limited to 2 for dev environment

    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.6.3
        args:
          - --model=unsloth/gpt-oss-20b
          - --dtype=bfloat16  # Use bfloat16 for better memory efficiency
          - --max-model-len=2048  # Reduced context length to fit in 20GB VRAM
          - --gpu-memory-utilization=0.85  # Conservative for 20GB card
          - --trust-remote-code
          - --served-model-name=gpt-oss-20b
          # Additional memory optimization flags
          - --disable-custom-all-reduce  # Disable for single GPU
          - --enforce-eager  # Use eager mode to save memory during compilation
        env:
          - name: HF_HOME
            value: /tmp/hf_home
          # Optional: Add HuggingFace token if model is private
          # - name: HUGGING_FACE_HUB_TOKEN
          #   valueFrom:
          #     secretKeyRef:
          #       name: huggingface-secret
          #       key: token
        resources:
          requests:
            cpu: "8"  # Higher CPU for 20B model
            memory: "24Gi"  # 20B models need more RAM
            nvidia.com/gpu: 1
          limits:
            cpu: "16"
            memory: "48Gi"
            nvidia.com/gpu: 1
        ports:
          - containerPort: 8000
            name: http1
            protocol: TCP

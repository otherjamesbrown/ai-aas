# KServe InferenceService Template for vLLM Models
# This template provides a reusable configuration for deploying vLLM models
#
# To use this template:
# 1. Copy this file and rename it (e.g., llama-2-7b.yaml)
# 2. Replace all {{PLACEHOLDERS}} with actual values
# 3. Adjust resource requests/limits based on model size
# 4. Deploy via GitOps

apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{MODEL_NAME}}  # e.g., llama-2-7b, mistral-7b, etc.
  namespace: {{NAMESPACE}}  # e.g., development, production
  labels:
    app: vllm-inference
    model: {{MODEL_NAME}}
    version: {{MODEL_VERSION}}  # e.g., v1, v2
    environment: {{ENVIRONMENT}}  # development, staging, production
  annotations:
    serving.kserve.io/deploymentMode: "Serverless"  # Use Knative Serving
    serving.kserve.io/autoscalerClass: "kpa"        # Knative Pod Autoscaler
spec:
  predictor:
    # Model configuration
    model:
      modelFormat:
        name: vllm
      storageUri: {{STORAGE_URI}}  # e.g., hf://meta-llama/Llama-2-7b-hf, s3://bucket/model
      protocolVersion: v2

    # Scaling configuration
    # Adjust based on expected traffic and cost requirements
    minReplicas: {{MIN_REPLICAS}}  # 0 for scale-to-zero (dev), 1+ for production
    maxReplicas: {{MAX_REPLICAS}}  # Maximum pods under load (e.g., 5-10)
    scaleTarget: {{SCALE_TARGET}}  # Target concurrent requests per pod (e.g., 5)
    scaleMetric: concurrency       # Scale based on concurrent requests

    # Resource requirements
    # Adjust based on model size:
    # - 7B models: 16Gi memory, 1 GPU
    # - 13B models: 32Gi memory, 1-2 GPUs
    # - 70B models: 128Gi+ memory, 4-8 GPUs
    resources:
      requests:
        cpu: "{{CPU_REQUEST}}"          # e.g., "4"
        memory: "{{MEMORY_REQUEST}}"    # e.g., "16Gi"
        nvidia.com/gpu: {{GPU_REQUEST}} # e.g., 1
      limits:
        cpu: "{{CPU_LIMIT}}"            # e.g., "8"
        memory: "{{MEMORY_LIMIT}}"      # e.g., "32Gi"
        nvidia.com/gpu: {{GPU_LIMIT}}   # e.g., 1

    # Container configuration (vLLM)
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:{{VLLM_VERSION}}  # e.g., v0.3.0
        args:
          - --model=/mnt/models
          - --dtype={{DTYPE}}                      # float16, bfloat16, auto
          - --max-model-len={{MAX_MODEL_LEN}}      # e.g., 4096, 8192
          - --gpu-memory-utilization={{GPU_UTIL}}  # e.g., 0.9 (90%)
          - --trust-remote-code
          - --served-model-name={{MODEL_NAME}}
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: huggingface-secret
                key: token
          - name: HF_HOME
            value: /tmp/hf_home
        ports:
          - containerPort: 8080
            name: h2c
            protocol: TCP

    # GPU node scheduling
    # Uncomment and adjust if you need to target specific GPU types
    nodeSelector:
      kserve.io/gpu: "true"
      # nvidia.com/gpu.product: {{GPU_TYPE}}  # e.g., NVIDIA-A100-SXM4-40GB

    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

    # Autoscaling annotations (Knative)
    # These control the autoscaling behavior
    metadata:
      annotations:
        autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"
        autoscaling.knative.dev/metric: "concurrency"
        autoscaling.knative.dev/target: "{{SCALE_TARGET}}"
        autoscaling.knative.dev/minScale: "{{MIN_REPLICAS}}"
        autoscaling.knative.dev/maxScale: "{{MAX_REPLICAS}}"
        autoscaling.knative.dev/scaleDownDelay: "{{SCALE_DOWN_DELAY}}"  # e.g., "5m"
        autoscaling.knative.dev/window: "60s"

---

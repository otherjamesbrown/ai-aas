apiVersion: aimodel.ai-aas.io/v1alpha1
kind: ModelRecipe
metadata:
  name: llama-3.1-8b-instruct-trtllm
  namespace: ai-model-system
  labels:
    ai.ai-aas.io/model-family: llama
    ai.ai-aas.io/model-size: 8b
    ai.ai-aas.io/task: text-generation
    ai.ai-aas.io/runtime: tensorrt-llm
spec:
  modelID: meta-llama/Llama-3.1-8B-Instruct
  displayName: "Llama 3.1 8B Instruct (TensorRT-LLM)"
  description: "Meta's Llama 3.1 8B Instruct optimized with TensorRT-LLM on Triton"
  runtime: tensorrt-llm
  image: nvcr.io/nvidia/tritonserver:24.04-trtllm-python-py3
  resources:
    gpu:
      vendor: nvidia
      count: 1
      minMemoryGB: 24
    cpu:
      requests: "8"
      limits: "16"
    memory:
      requests: "32Gi"
      limits: "48Gi"
  runtimeArgs:
    triton:
      backend: tensorrt
      modelRepository: "s3://ai-aas-models/triton/llama-3.1-8b-instruct-trtllm"
      instanceGroup:
        - kind: KIND_GPU
          count: 1
      dynamicBatching:
        maxBatchSize: 64
        maxQueueDelayMicroseconds: 100000
  scheduling:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    nodeSelector:
      nvidia.com/gpu.present: "true"
  healthCheck:
    startupProbeSeconds: 600
    livenessPath: /v2/health/live
    readinessPath: /v2/health/ready
  metadata:
    parameters: "8B"
    contextLength: 128000
    architecture: LlamaForCausalLM
    license: "Llama 3.1 Community License"
    sourceURL: "https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct"

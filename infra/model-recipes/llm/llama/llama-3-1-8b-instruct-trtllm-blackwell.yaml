apiVersion: aimodel.ai-aas.io/v1alpha1
kind: ModelRecipe
metadata:
  name: llama-3-1-8b-instruct-trtllm-blackwell
  namespace: ai-model-system
  annotations:
    # Engine version dependencies - CRITICAL: engine must match runtime
    ai.ai-aas.io/trtllm-version: "0.20.0"
    ai.ai-aas.io/min-triton-version: "25.06"
    ai.ai-aas.io/gpu-architecture: "sm_120"
    ai.ai-aas.io/engine-build-date: "2026-01"
    ai.ai-aas.io/cuda-version: "13.0"
  labels:
    ai.ai-aas.io/model-family: llama
    ai.ai-aas.io/model-size: 8b
    ai.ai-aas.io/task: text-generation
    ai.ai-aas.io/runtime: tensorrt-llm
    ai.ai-aas.io/gpu-architecture: blackwell
spec:
  modelID: meta-llama/Llama-3.1-8B-Instruct
  displayName: "Llama 3.1 8B Instruct (TensorRT-LLM, Blackwell)"
  description: "Meta's Llama 3.1 8B Instruct optimized with TensorRT-LLM on Triton for Blackwell GPUs (sm_120)"
  runtime: tensorrt-llm
  image: nvcr.io/nvidia/tritonserver:25.06-trtllm-python-py3
  resources:
    gpu:
      vendor: nvidia
      count: 1
      minMemoryGB: 24
    cpu:
      requests: "8"
      limits: "16"
    memory:
      requests: "32Gi"
      limits: "48Gi"
  runtimeArgs:
    triton:
      backend: tensorrt
      modelRepository: "s3://ai-aas/models/llama-3.1-8b-instruct-trtllm-blackwell"
      instanceGroup:
        - kind: KIND_GPU
          count: 1
      dynamicBatching:
        maxBatchSize: 64
        maxQueueDelayMicroseconds: 100000
  scheduling:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    nodeSelector:
      nvidia.com/gpu.present: "true"
      node.kubernetes.io/instance-type: g3-gpu-rtxpro6000-blackwell-1
  healthCheck:
    startupProbeSeconds: 600
    livenessPath: /v2/health/live
    readinessPath: /v2/health/ready
  metadata:
    parameters: "8B"
    contextLength: 128000
    architecture: LlamaForCausalLM
    license: "Llama 3.1 Community License"
    sourceURL: "https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct"

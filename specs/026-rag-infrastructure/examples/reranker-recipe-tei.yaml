# Example: Reranker Model Recipe for BGE Reranker (TEI Runtime)
# Rerankers improve RAG quality by reordering initial retrieval results
apiVersion: ai.ai-aas.io/v1alpha1
kind: ModelRecipe
metadata:
  name: bge-reranker-v2-m3
  namespace: ai-model-system
  labels:
    ai.ai-aas.io/model-family: bge
    ai.ai-aas.io/task: reranking
    ai.ai-aas.io/runtime: tei
spec:
  modelID: BAAI/bge-reranker-v2-m3
  displayName: "BGE Reranker v2 M3"
  description: |
    BAAI's cross-encoder reranker model with multilingual support.
    Use after initial retrieval to reorder top-k results for better relevance.
    Significantly improves RAG accuracy compared to embedding-only retrieval.

  runtime: tei
  image: ghcr.io/huggingface/text-embeddings-inference:1.5

  resources:
    gpu:
      type: nvidia
      count: 1
      minMemoryGB: 4
    cpu:
      requests: "2"
      limits: "4"
    memory:
      requests: "4Gi"
      limits: "8Gi"

  runtimeArgs:
    tei:
      # IMPORTANT: modelType must be "reranker" for cross-encoder scoring
      modelType: reranker

      # Reranking is more compute-intensive per pair
      maxBatchTokens: 8192
      maxConcurrentRequests: 128

      dtype: float16

      extraArgs:
        - --auto-truncate

  scheduling:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: gpu-workload
        operator: Equal
        value: "true"
        effect: NoSchedule

  healthCheck:
    startupProbeSeconds: 60
    livenessPath: /health
    readinessPath: /health

  metadata:
    parameters: "568M"
    maxSequenceLength: 8192
    architecture: "XLMRobertaForSequenceClassification"
    license: "MIT"
    sourceURL: "https://huggingface.co/BAAI/bge-reranker-v2-m3"
    notes: |
      - Use for reranking top-k (typically 20-100) retrieved documents
      - Input format: [query, document] pairs
      - Returns relevance score (higher = more relevant)
      - Multilingual support (100+ languages)

---
# Lightweight reranker option - faster but less accurate
apiVersion: ai.ai-aas.io/v1alpha1
kind: ModelRecipe
metadata:
  name: ms-marco-minilm-l6
  namespace: ai-model-system
  labels:
    ai.ai-aas.io/model-family: cross-encoder
    ai.ai-aas.io/task: reranking
    ai.ai-aas.io/runtime: tei
spec:
  modelID: cross-encoder/ms-marco-MiniLM-L-6-v2
  displayName: "MS MARCO MiniLM L6 Reranker"
  description: |
    Lightweight cross-encoder reranker trained on MS MARCO.
    Good balance of speed and accuracy for English text.
    Recommended when latency is critical.

  runtime: tei
  image: ghcr.io/huggingface/text-embeddings-inference:1.5

  resources:
    # Can run on CPU for low-volume use cases
    gpu:
      type: nvidia
      count: 1
      minMemoryGB: 2  # Very small model
    cpu:
      requests: "2"
      limits: "4"
    memory:
      requests: "2Gi"
      limits: "4Gi"

  runtimeArgs:
    tei:
      modelType: reranker
      maxBatchTokens: 16384  # Can handle more due to small size
      maxConcurrentRequests: 256
      dtype: float16
      extraArgs:
        - --auto-truncate

  scheduling:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: gpu-workload
        operator: Equal
        value: "true"
        effect: NoSchedule

  healthCheck:
    startupProbeSeconds: 30  # Very fast to load
    livenessPath: /health
    readinessPath: /health

  metadata:
    parameters: "22M"
    maxSequenceLength: 512
    architecture: "BertForSequenceClassification"
    license: "Apache-2.0"
    sourceURL: "https://huggingface.co/cross-encoder/ms-marco-MiniLM-L-6-v2"
    notes: |
      - English-only
      - 6-layer BERT, very fast inference
      - Good for high-throughput, latency-sensitive applications
      - Can also run on CPU with reasonable performance


# Large high-accuracy reranker
apiVersion: ai.ai-aas.io/v1alpha1
kind: ModelRecipe
metadata:
  name: bge-reranker-v2-gemma
  namespace: ai-model-system
  labels:
    ai.ai-aas.io/model-family: bge
    ai.ai-aas.io/task: reranking
    ai.ai-aas.io/runtime: tei
spec:
  modelID: BAAI/bge-reranker-v2-gemma
  displayName: "BGE Reranker v2 Gemma"
  description: |
    High-accuracy reranker based on Gemma architecture.
    Best reranking quality, but requires more resources.
    Use when accuracy is more important than latency.

  runtime: tei
  image: ghcr.io/huggingface/text-embeddings-inference:1.5

  resources:
    gpu:
      type: nvidia
      count: 1
      minMemoryGB: 16  # Larger model needs more VRAM
    cpu:
      requests: "4"
      limits: "8"
    memory:
      requests: "16Gi"
      limits: "32Gi"

  runtimeArgs:
    tei:
      modelType: reranker
      maxBatchTokens: 4096  # Lower batch size due to model size
      maxConcurrentRequests: 64
      dtype: float16
      extraArgs:
        - --auto-truncate

  scheduling:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: gpu-workload
        operator: Equal
        value: "true"
        effect: NoSchedule

  healthCheck:
    startupProbeSeconds: 120  # Larger model, slower load
    livenessPath: /health
    readinessPath: /health

  metadata:
    parameters: "2B"
    maxSequenceLength: 8192
    architecture: "GemmaForSequenceClassification"
    license: "MIT"
    sourceURL: "https://huggingface.co/BAAI/bge-reranker-v2-gemma"
    notes: |
      - Highest accuracy BGE reranker
      - Based on Google's Gemma architecture
      - Use for applications where quality > speed
      - Multilingual support

# Example: AIModel that references a recipe
# Much simpler than specifying everything inline!
apiVersion: ai.ai-aas.io/v1alpha1
kind: AIModel
metadata:
  name: mistral-7b-instruct-v03
  namespace: staging
  labels:
    environment: staging
spec:
  # Reference the centralized recipe
  recipeRef:
    name: mistral-7b-instruct-v03
    namespace: ai-model-system

  # Environment-specific overrides (optional)
  overrides:
    replicas:
      min: 1
      max: 1  # Single replica for staging
    runtimeArgs:
      vllm:
        # Use less GPU memory in staging to leave room for debugging
        gpuMemoryUtilization: 0.85

  enabled: true

---
# Production deployment of the same model - different overrides
apiVersion: ai.ai-aas.io/v1alpha1
kind: AIModel
metadata:
  name: mistral-7b-instruct-v03
  namespace: production
  labels:
    environment: production
spec:
  recipeRef:
    name: mistral-7b-instruct-v03
    namespace: ai-model-system

  overrides:
    replicas:
      min: 2   # HA in production
      max: 5   # Scale up to 5 under load
    resources:
      gpu:
        count: 1  # Could use 2 for tensor parallelism

  enabled: true

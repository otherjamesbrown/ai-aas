# Probe Configuration Templates for vLLM InferenceServices
# Feature: 018-model-readiness-probes
# Date: 2025-11-28
#
# These templates provide copy-paste probe configurations for different model sizes.
# Use the appropriate template based on your model's parameter count.

---
# ============================================================================
# TEMPLATE: 7B Model Probes (e.g., mistral-7b, llama-2-7b)
# Total Startup Timeout: ~6 minutes (30s + 36×10s)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-config-7b-template
  labels:
    app.kubernetes.io/name: probe-config
    model-size: "7b"
data:
  probe-config.yaml: |
    # Copy this into your InferenceService containers section
    startupProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 36
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 30
      failureThreshold: 3
      timeoutSeconds: 5


# KServe InferenceService for vLLM Model (Llama-2-7b)
# This is a complete example showing all configuration options
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama-2-7b
  namespace: development
  labels:
    app: vllm-inference
    model: llama-2-7b
    version: v1
    environment: development
  annotations:
    serving.kserve.io/deploymentMode: "Serverless"  # Use Knative Serving
    serving.kserve.io/autoscalerClass: "kpa"        # Knative Pod Autoscaler
spec:
  predictor:
    # Model configuration
    model:
      modelFormat:
        name: vllm
      storageUri: hf://meta-llama/Llama-2-7b-hf  # Hugging Face model URI
      protocolVersion: v2

    # Scaling configuration
    minReplicas: 1              # Keep 1 pod warm (set to 0 for scale-to-zero)
    maxReplicas: 10              # Maximum pods under load
    scaleTarget: 5              # Target: 5 concurrent requests per pod
    scaleMetric: concurrency    # Scale based on concurrent requests

    # Resource requirements
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
        nvidia.com/gpu: 1
      limits:
        cpu: "8"
        memory: "32Gi"
        nvidia.com/gpu: 1

    # Container configuration (vLLM)
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.3.0
        args:
          - --model=/mnt/models
          - --dtype=float16
          - --max-model-len=4096
          - --gpu-memory-utilization=0.9
          - --trust-remote-code
          - --served-model-name=llama-2-7b
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: huggingface-secret
                key: token
          - name: HF_HOME
            value: /tmp/hf_home
        ports:
          - containerPort: 8080
            name: h2c
            protocol: TCP

    # GPU node scheduling
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-40GB  # Target specific GPU type
      kserve.io/gpu: "true"

    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

    # Autoscaling annotations (Knative)
    metadata:
      annotations:
        autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"
        autoscaling.knative.dev/metric: "concurrency"
        autoscaling.knative.dev/target: "5"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/scaleDownDelay: "5m"
        autoscaling.knative.dev/window: "60s"

---
# Secret for Hugging Face authentication (create separately)
apiVersion: v1
kind: Secret
metadata:
  name: huggingface-secret
  namespace: development
type: Opaque
stringData:
  token: "hf_..."  # Replace with actual Hugging Face token
